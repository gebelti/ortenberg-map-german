wir heute in der Zeitung gelesen haben, zu halten glauben. Die Löcher in der Mauer, durch die der Wind pfeift, sind mit Wellblech und Zeltbahnen zugehängt, und nun ist es sehr wohnlich. Heute morgen um 4 Uhr gab es ein mächtiges Gepolter; da bezog der Posten oben auf dem Wellblechdache seine erste Tagesnummer. W. fuhr ganz aus dem Schlaf und behauptete, es wäre ein Pferd auf dem Dach.&quot;},{&quot;name&quot;:&quot;Springfontein, angekündigt&quot;,&quot;date&quot;:&quot;ab 13.03.1905?&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Am 12. März wird eine Verlegung nach Springfontein angekündigt.&quot;,&quot;note&quot;:&quot;Kein eigener Ankunftsbericht; am 20. März schreibt er aus Stamprietfontein. Möglicher Namens- oder Übertragungsfehler bleibt offen.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:557,&quot;quote&quot;:&quot;[12. März 1905.]\n\nDie Compagnie rückt nach Springfontein. Leb wohl, Schürfpenz, morgen wird gepackt. Wir haben bei der Nachricht alle recht lange Gesichter gemacht, der Platz war uns durch das viele, was wir hier geschaffen, lieb geworden.\n\n1.&quot;},{&quot;name&quot;:&quot;Stamprietfontein / Stampriet&quot;,&quot;date&quot;:&quot;20.03.1905&quot;,&quot;coord&quot;:[18.40464,-24.34494],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Lager mit Funkentelegrafenabteilung.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3352934&quot;,&quot;line&quot;:564,&quot;quote&quot;:&quot;[Stamprietfontein, 20. März 1905.]\n\n1.  \n\nP. und ich haben uns ein luftiges Zelt gebaut. Heute nachmittag trifft die Funkentelegraphenabteilung hier ein. Nach kurzer Zeit ist auch schon the Motor im Gang und der Drachen, um den sich bald eine Menge Raubvögel sammeln, ist hoch in der Luft. Kurze Zeit darauf ist schon Verbindung mit dem über 100 km weit entfernten Kub hergestellt. Es sieht hier aus, wie auf einem Jahrmarkt. Zelte und Buden in den abenteuerlichsten Formen, bunte Wimpel überall, Ochsen, Esel, Pferde, Schafe, Soldaten und hoch darüber Drachen und Ballons.&quot;},{&quot;name&quot;:&quot;Witkrans&quot;,&quot;date&quot;:&quot;31.03.1905, morgens&quot;,&quot;coord&quot;:[18.49934,-24.43575],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Marsch in der Morgendämmerung bis Witkrans.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3352113&quot;,&quot;line&quot;:570,&quot;quote&quot;:&quot;[31. März 1905.]\n\nAuf dem Marsch. Ganz feucht von dem nächtlich gefallenen Tau und von Moskitos zerstochen, ging es im Morgengrauen weiter bis Witkrans. Nachmittags kommen wir über das Gefechtsfeld von Groß-Nabas, wo vor einem Vierteljahr die Abteilung Meister in harter Bedrängnis lag. P. erklärte mir die damalige Gefechtslage. An dem Geschützstand Haufen von Geschoßkörben und Kartuschen, ganze Gespanne von Maultieren noch in den Geschirren liegend, tot mit aufgeblähtem Bauch und in die Luft gestreckten Beinen. Zerschossene Bäume und allerlei umherliegendes Gerät; darüber kreisende Geier. Die Gräber der Reiter und Offiziere leider schon sehr zerfallen.&quot;},{&quot;name&quot;:&quot;Groß-Nabas&quot;,&quot;date&quot;:&quot;31.03.1905, nachmittags&quot;,&quot;coord&quot;:[18.52495,-24.48518],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Überquerung des Gefechtsfelds vom Jahresanfang.&quot;,&quot;note&quot;:&quot;Farmkoordinate als Ortsbezug; keine Vermessung des Gefechtsfelds.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3357079&quot;,&quot;line&quot;:570,&quot;quote&quot;:&quot;[31. März 1905.]\n\nAuf dem Marsch. Ganz feucht von dem nächtlich gefallenen Tau und von Moskitos zerstochen, ging es im Morgengrauen weiter bis Witkrans. Nachmittags kommen wir über das Gefechtsfeld von Groß-Nabas, wo vor einem Vierteljahr die Abteilung Meister in harter Bedrängnis lag. P. erklärte mir die damalige Gefechtslage. An dem Geschützstand Haufen von Geschoßkörben und Kartuschen, ganze Gespanne von Maultieren noch in den Geschirren liegend, tot mit aufgeblähtem Bauch und in die Luft gestreckten Beinen. Zerschossene Bäume und allerlei umherliegendes Gerät; darüber kreisende Geier. Die Gräber der Reiter und Offiziere leider schon sehr zerfallen.&quot;},{&quot;name&quot;:&quot;Klein-Nabas&quot;,&quot;date&quot;:&quot;01.04.1905&quot;,&quot;coord&quot;:[18.55511,-24.52294],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Passage eines engen Felsentors.&quot;,&quot;note&quot;:&quot;Klein Nabas West dient als Ortsbezug; genauer Engpass unbestimmt.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3356129&quot;,&quot;line&quot;:574,&quot;quote&quot;:&quot;[1. April 1905.]\n\nFrüh durch das gefürchtete Felsentor von Kleinnabas, wo vor kurzem die Proviantkolonne überfallen war. Ein ganz gefährlicher Engpaß mit zwanzig Meter senkrecht in die Höhe emporstrebenden Felswänden. Die Gemütlichkeit erhöhen auch hier nicht gerade die frischen Gräber und die einen furchtbaren Geruch verbreitenden Kadaver der erschossenen Ochsen und Esel.&quot;},{&quot;name&quot;:&quot;Swartfontein am Auob&quot;,&quot;date&quot;:&quot;03.04.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Orientierungspatrouille am gegenüberliegenden Ufer des Auob.&quot;,&quot;note&quot;:&quot;Nicht mit gleichnamigen Farmen westlich des Auob gleichgesetzt.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:578,&quot;quote&quot;:&quot;[Swartfontein, 3. April 1905.]\n\nFrüh mit P. eine Orientierungspatrouille geritten. Auf dem jenseitigen Ufer des Auob eine steile Schlucht aufwärts. Hier fanden wir die von der Abteilung Deimling zerschossenen Ochsenwagen. Allerlei zum großen Teil aus Farmen gestohlener Hausrat lag herum. Ein Bild trauriger Zerstörung; alles kurz und klein geschlagen. Knochen und Schädel einiger hier von den Granaten getroffener Witboys liegen herum. In der Nähe hören wir plötzlich ein wütendes Kläffen und dazwischen leises Winseln. Hinzureitend finden wir in einem verlassenen Schakalbau eine Kaffernhündin, die halbverhungert ihren frischen Wurf von 6 Kleinen gegen uns verteidigen will. Haß sprüht aus ihren Augen. Vielleicht war ihr Herr einer der Erschlagenen. Kurz vor Mittag kehren wir von unserem Ritt hungrig heim, wo S., mein Bursche, inzwischen die „Kost klar gemacht hatte“. Es gab Erbswurstsuppe mit langfädigem Cornedbeef; die Fäden waren so lang, daß, wenn das eine Ende schon beinahe im Magen, das andere noch im Munde war. Jedoch schmeckte uns das Mahl vorzüglich. Jetzt liege ich zum Nachmittagsschlummer auf einer Krankenbahre aus dem Batteriekrankenwagen unter dem Schatten eines Kameldornbaumes im roten Sande der Düne und träume, ich wäre am Meere und hinter der nächsten Düne rauschte die kühle See.&quot;},{&quot;name&quot;:&quot;Hunirob am Auob&quot;,&quot;date&quot;:&quot;17.–29.04.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Lager am Auob mit schwieriger Wasserversorgung; Vorbereitung eines Vorstoßes.&quot;,&quot;note&quot;:&quot;Historische Wasserstelle nicht sicher lokalisiert.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:582,&quot;quote&quot;:&quot;[Hunirob, 17. April 1905.]\n\nDie Wasserverhältnisse sind hier die denkbar schlechtesten. Ein begonnener Brunnenbau in der Talsohle des Auob mußte nach 2 m Tiefe aufgegeben werden, da wir auf festen Felsen stießen. So sind wir auf das schlammige Regenwasser angewiesen. Der auf dem Sanitätswagen mitgeführte Berkefeldfilter funktionierte nicht, da sich der dicke Schlamm sofort in die Poren des Tonzylinders festsetzt. So wenden wir die Methode des Klärens mit Alaun an; die liefert aber nur wenig klares Wasser. Ich wollte heute auf Jagd; als ich jedoch unten ins Tal kam, fand ich einen großen Baum dichtbesetzt mit den Nestern der Gesellschaftswebervögel, deren Leben und Gebaren war so interessant, daß ich mich unter den Baum legte und den ganzen Vormittag den Tierchen zugesehen habe. Da bauen sich 50—60 stahigroße, bunte Vögel ein großes Strohdach von ein bis zwei Quadratmetern in einen Baum und hängen darunter ihre Nester, wie Waben eines Bienenstocks, mit dem Einschlupf von unten. Jetzt sind sie gerade in der Zeit, wo die Jungen ausgekommen waren; das gab ein emsiges Ab- und Zufliegen, bis alle die jungen Schnäbel gefüllt waren. Ein Kapitän scheint es hier auch zu geben, denn einer saß ganz gravitätisch auf einem Ast und sah dem Treiben zu.&quot;},{&quot;name&quot;:&quot;Kalahari / Elefantenfluss / Gagams-Bley&quot;,&quot;date&quot;:&quot;30.04.–01.05.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Ostwärts über zahlreiche Dünen und das trockene Bett des Elefantenflusses; kein Wasser am gesuchten Ziel.&quot;,&quot;note&quot;:&quot;Keine belastbaren Wegpunkte für diesen Vorstoß; Gagams-Bley wird im Text selbst als unsicher beschrieben.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:594,&quot;quote&quot;:&quot;[In der Kalahari, 1. Mai.]\n\nGestern nachmittag sind wir Richtung ostwärts abmarschiert. Herauf und herunter, herauf und herunter. Immer eine Düne steiler wie die anderen und dazwischen in einem Tal der Sand tiefer, wie in dem anderen. Nach der 30. Düne holten wir die vorausgesandten Wasserwagen ein, vor jedem 20 Joch Ochsen, die mit aller Anstrengung, die Wagen, welche bis an die Achsen im Sande mahlten, kaum fortschleppten. Allmählich fingen die Pferde an zu keuchen und waren trotz der empfindlichen Nachtkälte naß wie aus dem Wasser gezogen. An der 60. Düne kamen wir in das Revier des die Kalahari durchziehenden Elefantenflusses, der seinen Namen wohl daher hat, weil es an ihm weder Elefanten gibt, noch weil er ein Fluß ist. Denn seit mindestens einem halben Jahrhundert ist in ihm kein Tropfen Wasser geflossen. Früher, als die klimatischen Verhältnisse noch andere hier waren, muß er ein reißender Strom gewesen sein, der seine senkrecht abfallenden Ufer tief in den Felsen eingegraben hat. Hier machten wir kurze Rast. Dann ging&#x27;s weiter, noch 30 Dünen. Hier soll die sagenhafte Gagams-Bley sein, das Wassereldorado für durstende Tiere und Menschen, an der sich die Reste des Witboystammes aufhalten sollten. Aber kein Wasser und keine Hottentotten! In weitem Umkreis nichts als Sand und Steppe. Keine Wagenspur, nur einige kleine Feuerstellen, an denen vielleicht eine Witboypatrouille gelagert.&quot;},{&quot;name&quot;:&quot;Rückkehr an den Auob&quot;,&quot;date&quot;:&quot;02.05.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Nach zwei Nächten des Wüstenmarsches Rückkehr gegen Mittag.&quot;,&quot;note&quot;:&quot;Rückkehrstelle nicht genannt.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:598,&quot;quote&quot;:&quot;[2. Mai 1905.]\n\nAm Auob. Die gestern noch weiter vorgetriebenen Patrouillen kamen alle zurück, ohne eine Spur vom Feinde gesehen zu haben. Kein Wasser, keine Hottentotten. Nun ging&#x27;s zurück; und es war auch die höchste Zeit. Unsere Pferde sind durch die Anstrengung und den Durst in der einen Nacht fast zu Skeletten abgemagert. Nach 20 Dünen kamen wir an die ersten uns nachgefahrenen Wasserwagen, wo jedes Tier einen Freßbeutel voll Wasser bekam. Nach weiteren 20 Dünen gab&#x27;s schon zwei Wasserbeutel für Roß und Reiter; und so ging&#x27;s in der zweiten Nacht zurück immer langsamer und schleichender, so daß wir heute erst gegen Mittag ziemlich erschöpft wieder am Auob eintrafen. Der Vorstoß in die Wüste war von Major von E. mit alter afrikanischer Sachkenntnis und Ruhe angelegt. Wir haben die entfernteste Stelle erreicht und trotzdem auch nicht ein Tier verloren.&quot;},{&quot;name&quot;:&quot;Aubes&quot;,&quot;date&quot;:&quot;06.05.1905&quot;,&quot;coord&quot;:[18.88722,-25.01269],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Lager am Rand der Kalahari; Empfang von Paketen aus Deutschland.&quot;,&quot;note&quot;:&quot;Plausible Zuordnung zur heutigen Farm Aubes am unteren Auob.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/12537885&quot;,&quot;line&quot;:602,&quot;quote&quot;:&quot;[Aubes, 6. Mai 1905.]\n\nGestern haben wir eine Fracht Liebesgaben bekommen. Das Bewußtsein, daß wir hier fern an der Wüstengrenze nicht allein stehen mit unseren Mühen und Nöten, sondern mitfühlende Herzen daheim unserer gedenken, tat uns wohl. Trotzdem nötigte uns manche gutgemeinte Gabe ein leises Lächeln ab. So sandten wir den Spendern einer Kiste, die eine adressierte Karte beigelegt hatten, folgende Verse:\n\nAn die Beamten der Hütte Hörde, Westfalen.\n\nAus der Kalahariwüste\n\nIn das Land der roten Erde\n\nSenden Dank wir und viel Grüße,\n\nDen Spendern von der Hütte Hörde,\n\nJuchheirasassa, der Tabak, der ist da!\n\nUnd der Kognak zum Kaffee\n\nHeilt des kranken Magens Weh.\n\nUnd die neue „Silbergabel“\n\nFührt das Cornedbeef zum Schnabel.\n\nAuf die gelbe Erbsenwurst,\n\nLöscht der Tee des Reiters Durst.\n\nNur können wir nicht begreifen,\n\nWas sollen wir mit Seifen!\n\nZwar Waschen wär&#x27; ein Hochgenuß,\n\nDoch Wasser fehlt im Auobfluß.\n\nWir liegen hier auf rotem Sande,\n\nAuf roter Erde wohnet ihr.\n\nBei euch sind Kohlen viel im Lande,\n\nHier Diamanten im Revier.\n\nUnd wenn wir die gefunden haben,\n\nDann schicken wir euch Liebesgaben.&quot;},{&quot;name&quot;:&quot;Nunub, Kalahari&quot;,&quot;date&quot;:&quot;27.05.–08.06.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Stationsbesatzung an einer Wasserstelle; Wohnen in einer Hütte auf einer Düne.&quot;,&quot;note&quot;:&quot;Das gleichnamige Nunub westlich der Kalahari passt nicht zum Bericht und wird nicht übernommen.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:650,&quot;quote&quot;:&quot;[Nunub, 27. Mai 1905.]\n\nWir sind zur Stationsbesatzung wieder übergegangen und liegen hier in Nunub, einer Wasserstelle, schon in der Kalahari. P. und ich haben einen alten festen Pontok aus Baumstämmen und Gras bezogen. Er ist rund angelegt, mit einem Spitzdach, das durch einen Pfahl in der Mitte gestützt wird, und draußen herum läuft ein 1 m hohes, dichtes Gitterflechtwerk, das den Sandsturm abhält. Wir haben das Innere mit Säcken austapeziert, so daß wir auch nachts vor der ziemlich empfindlichen Kälte geschützt sind. Wenn die Türen, die in Gestalt von Wellblech vor den beiden Öffnungen hängen, heruntergelassen sind, und wir bei trübem Laternenlicht vor einem Becher Tee bei unserer Pfeife sitzen, während draußen der Sturm heult, fühlen wir uns zurückversetzt in die Zeit unserer Knabenspiele, wo ein solches Indianer- und Jagdhaus unsere kühnste Phantasie befriedigt hätte. Ganz heimisch wird es einem, wenn man so sitzt und träumt, und von den Säcken, die die Wände verkleiden, winken einem an die deutsche Heimat erinnernd die lieben alten Namen entgegen: Proviantamt Potsdam, Ulm, Straßburg, Demmin, Breslau, Pasewalk. Alle deutschen Gaue daheim tragen mit den Erzeugnissen ihres Bodens, Hafer, Mehl, Bohnen, Erbsen usw. dazu bei, daß ihre Söhne draußen und die herausgesandten Tiere nicht Hunger leiden. Und dann im Gebälk der Hütte das einförmige Tik-Tik des Holzwurms. Man glaubt, eine alte gemütliche Wanduhr zu hören, die unaufhörlich, emsig die Zeit verkündigt, die Zeit, die hier in Afrika noch viel, viel langsamer vergeht, als in dem flüchtigen Getriebe europäischer Kultur.&quot;},{&quot;name&quot;:&quot;Lidfontein&quot;,&quot;date&quot;:&quot;08.06.1905?&quot;,&quot;coord&quot;:[18.21215,-24.03522],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Von Nunub zur Suche nach einer gemeldeten Herero-Gruppe.&quot;,&quot;note&quot;:&quot;Eintrag widersprüchlich: „Abmarsch heute abend“ und „Heute früh … eingetroffen“. Reihenfolge erkennbar, genauer Tag unsicher.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3355728&quot;,&quot;line&quot;:720,&quot;quote&quot;:&quot;[Nunub, 8. Juni 1905.]\n\nIn der Nähe von Guchanas soll eine größere Hererobande sich gezeigt haben. Die vierte Kompagnie wird von Nunub aus auf sie angesetzt. Abmarsch heute abend. Heute früh in Lidfontein eingetroffen. Vom Feinde bisher nichts zu sehen. Es geht eine Patrouille unter v. St. nach Westen, eine andere unter R. nach Norden; ich reite mit zwei Mann nach Guchanas, um mit der dortigen Besatzung Fühlung zu bekommen.&quot;},{&quot;name&quot;:&quot;Guchanas / Hoachanas&quot;,&quot;date&quot;:&quot;08.–09.06.1905&quot;,&quot;coord&quot;:[18.05328,-23.92109],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Ritt zur dortigen Besatzung und Besuch der Mission.&quot;,&quot;note&quot;:&quot;Historischer Name Guchanas als Hoachanas zugeordnet.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3356802&quot;,&quot;line&quot;:724,&quot;quote&quot;:&quot;[Lidfontein, 9. Juni 1905.]\n\nAus Guchanas zurück, wurde dort von Leutnant von H. und dem Missionar sehr liebenswürdig aufgenommen. Von den Hereros war dort bisher nichts gespürt. Bei der Menge von Vieh, das hier in der Nähe auf Weide steht, ist eine solche Bande aber immerhin gefährlich, und die Nachricht erregte große Unruhe. Guchanas ist der Sitz des ehemals mächtigen Stammes der „Roten Nation“. Einst ein großes Volk, sind sie heute sehr dezimiert. Etwa hundert Hütten sind noch bewohnt. Der Ort selbst ist wunderschön gelegen an den hier ständig fließenden Quellen des Auob. Von weitem glaubt der nahende Reiter ein deutsches Dorf vor sich zu haben; mitten im Grünen erhebt sich die stattliche weiße Kirche der rheinischen Mission, daran das feste Missionsgebäude, in dem ich gastliche Aufnahme fand. Fast ein Jahrhundert ist die christliche Mission hier schon alt, der erste Missionsplatz unter den Hottentotten, und hier kann man recht sehen, was Kultur und fleißige Arbeit aus dem vielgeschmähten Lande machen können. Rings um die Gebäude zieht sich ein großer Park, in welchem allerlei exotische Bäume üppig wuchern. Die prachtvoll blühenden Oleanderbäume und die Weinspaliere hatten allerdings durch den Frost in der Nacht etwas gelitten. Feigen- und Zitronenbäume waren gerade abgeerntet, und die fast einen Meter dicken Dattelpalmen mit ihren mächtigen Fächerblättern hatten zur zweiten Fruchtdolde im Jahre angesetzt. Gemüse, Kohl und Salat in üppiger Fülle. Ein großer Bienenstand mit vielen Stöcken fehlte nicht und soll guten Ertrag liefern.\n\nZum erstenmal wieder seit langer Zeit […]&quot;},{&quot;name&quot;:&quot;Lidfontein&quot;,&quot;date&quot;:&quot;09.06.1905&quot;,&quot;coord&quot;:[18.21215,-24.03522],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Rückkehr von Guchanas. Danach Textlücke bis August.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3355728&quot;,&quot;line&quot;:724,&quot;quote&quot;:&quot;[Lidfontein, 9. Juni 1905.]\n\nAus Guchanas zurück, wurde dort von Leutnant von H. und dem Missionar sehr liebenswürdig aufgenommen. Von den Hereros war dort bisher nichts gespürt. Bei der Menge von Vieh, das hier in der Nähe auf Weide steht, ist eine solche Bande aber immerhin gefährlich, und die Nachricht erregte große Unruhe. Guchanas ist der Sitz des ehemals mächtigen Stammes der „Roten Nation“. Einst ein großes Volk, sind sie heute sehr dezimiert. Etwa hundert Hütten sind noch bewohnt. Der Ort selbst ist wunderschön gelegen an den hier ständig fließenden Quellen des Auob. Von weitem glaubt der nahende Reiter ein deutsches Dorf vor sich zu haben; mitten im Grünen erhebt sich die stattliche weiße Kirche der rheinischen Mission, daran das feste Missionsgebäude, in dem ich gastliche Aufnahme fand. Fast ein Jahrhundert ist die christliche Mission hier schon alt, der erste Missionsplatz unter den Hottentotten, und hier kann man recht sehen, was Kultur und fleißige Arbeit aus dem vielgeschmähten Lande machen können. Rings um die Gebäude zieht sich ein großer Park, in welchem allerlei exotische Bäume üppig wuchern. Die prachtvoll blühenden Oleanderbäume und die Weinspaliere hatten allerdings durch den Frost in der Nacht etwas gelitten. Feigen- und Zitronenbäume waren gerade abgeerntet, und die fast einen Meter dicken Dattelpalmen mit ihren mächtigen Fächerblättern hatten zur zweiten Fruchtdolde im Jahre angesetzt. Gemüse, Kohl und Salat in üppiger Fülle. Ein großer Bienenstand mit vielen Stöcken fehlte nicht und soll guten Ertrag liefern.\n\nZum erstenmal wieder seit langer Zeit […]&quot;},{&quot;name&quot;:&quot;Mukorab&quot;,&quot;date&quot;:&quot;01.08.1905&quot;,&quot;coord&quot;:[18.12204,-25.55695],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Mittagsrast auf dem Marsch nach Westen. Der Große Brukaros liegt laut Text am westlichen Horizont.&quot;,&quot;note&quot;:&quot;Mögliche Entsprechung Mukorob; nur vorläufige Zuordnung zur heutigen Farm.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/12537045&quot;,&quot;line&quot;:732,&quot;quote&quot;:&quot;[Mukorab, 1. August 1905.]\n\nAuf dem Marsch nach Westen zur Einkreisung der Hottentotten. Die Witboys haben die Absperrungslinie an der Kalaharigrenze durchbrochen und sind in kleinen Trupps nach Westen gegangen. Wir sind jetzt hinter ihnen her; unter Major v. E.s Führung geht&#x27;s ein scharfes Tempo! Bei Sonnenaufgang hatten wir schon eine gute Strecke zurückgelegt, und wir ließen die Pferde eine Weile fressen, weil sie in dieser Zeit am liebsten das frische Gras zu sich nehmen. Jetzt sind wir zur Mittagsrast hier in M. Die Gegend hat sich gänzlich verändert. Hier fällt das Hochplateau in grotesken Felsbildungen zu einem tiefen Talkessel ab. Schöne Grasflächen und Bäume sind unten im Grund. Hinten am Horizont im Westen die emporragenden Höhen des Gr. Brukarosgebirges. Hier eine zerstörte Farm mit Wänden aus Ochsenmist, daneben ein etwa 30 m tiefer Brunnen. Das Wasser ist klar, aber riecht entsetzlich faulig, es ist reichlich schwefelhaltig; aber auch in dieser Fasson schmeckt der Kaffee ganz erträglich, wenn man Durst hat. So hat man in Deutsch-Südwest seine Abwechslung. In Stamprietfontein ein Karlsbad, Marienbad, hier ein Aachen. Ein findiger Unternehmer könnte ein großes Kuretablissement für allerlei Gebrechen hier einrichten.&quot;},{&quot;name&quot;:&quot;Ofis am Auob&quot;,&quot;date&quot;:&quot;03.08.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Lager während des Aufmarschs weiterer Truppen.&quot;,&quot;note&quot;:&quot;Ortsname und Flusszuordnung nicht gesichert. Die zusätzliche Nähe zu Gibeon macht die Angabe erklärungsbedürftig.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:736,&quot;quote&quot;:&quot;[Ofis am Auob, 3. August 1905.]\n\nHier ist es wunderhübsch. Wo im Lande Wasser ist, da schießt gleich eine üppige Vegetation empor, in der sich auch bald eine reichhaltige Tierfauna entwickelt. Die Vogelarten sind unzählig; buntschillernde Papageien, Kakadus usw. in allen Farbennuancen und Größen, bis zu den kleinsten Kolibriarten, erfüllen die Luft mit einem Konzert, wie man es in seiner Eigenart in Europa nur in der Vogelvoliere eines zoologischen Gartens gewohnt ist. Schlangen, Leguane und allerlei Kriechtiere bevölkern Busch und Baum. Besonders unangenehm sind die vielen Baumratten, die nachts ihre Akrobatenkunststücke machen und dem friedlich Schlummernden allerlei Unangenehmes ins Gesicht fallen lassen. Heute sprang eine Springbockantilope, von der Pferdeweide aufgeschreckt, mitten durchs Lager. Die Jagd ist natürlich wegen Alarmbeunruhigung verboten. Gelegenheit wäre reichlich vorhanden, und oft zuckt einem der Finger nach der nah hängenden Büchse. Bis der Aufmarsch der Truppen, die teilweise aus dem südlichen Kriegsschauplatz herangezogen werden, vollendet ist, wird&#x27;s wohl noch eine ganze Zeit dauern. Vielleicht findet einer von uns inzwischen in der blauen Schiefererde hier, die dem Grund von Kimberley sehr ähnlich sein soll, welche hier um Gibeon herum sehr reichlich vorkommt, einen großen Diamanten.&quot;},{&quot;name&quot;:&quot;Farm Deutsche Erde&quot;,&quot;date&quot;:&quot;15.–16.08.1905&quot;,&quot;coord&quot;:[17.75647,-25.44692],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Ankunft am Fischfluss; Spaziergang am Ufer am folgenden Morgen.&quot;,&quot;note&quot;:&quot;Gleichnamige Farm als vorläufiger Ortsbezug.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3358021&quot;,&quot;line&quot;:740,&quot;quote&quot;:&quot;[Farm „Deutsche Erde“, am Fischfluß, 15. August 1905.]\n\nMittags hier eingetroffen. Der Fischfluß ist der einzige Fluß in der Kolonie, der dauernd wenigstens an einzelnen Stellen Wasser führt; deswegen sind seine Ufer auch reich an Vegetation und Tierleben. Gänse, Enten, Reiher und allerlei andere Wasservögel ziehen über den Fluß hin und her; große Fische und Krebse kann man im Wasser fangen. Eine hübsche, leider auch zerstörte Farm, liegt an dem Ufer. Der ganze Platz erinnert an die Ufer eines Havelsees. In der Farm, in der es wüst aussieht, liegen eine Menge teilweise sehr wertvoller medizinischer Bücher herumgestreut; hier wohnte als Farmer ein Arzt Dr. R. Er sowohl wie seine resolute Wirtschafterin, waren bekannte Persönlichkeiten. Letztere war ebenso handfest in der Zucht ihres eingeborenen Personals wie auch fest gegen große Quantitäten alkoholischer Getränke. Heute schon vor Sonnenaufgang (16. August) erwacht, da die grauen Papageien in den Bäumen so krächzten und schrien, daß einem der Schlaf verging. Mit P. einen kleinen Fußmarsch längs der wunderhübschen Ufer des Flusses gemacht.&quot;},{&quot;name&quot;:&quot;Ganaus am Leberfluss&quot;,&quot;date&quot;:&quot;18.08.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Am Vorabend vom Fischfluss zum Leberfluss marschiert.&quot;,&quot;note&quot;:&quot;Mehrere ähnliche heutige Namen; keine sichere Farmzuordnung.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:744,&quot;quote&quot;:&quot;[Ganaus, 18. August 1905.]\n\nVom schönen Fischfluß weg gestern abend zum Leberfluß marschiert. Die Hottentotten weichen vor uns nach Westen zurück. Ich werde scheußlich von Zahnschmerzen geplagt; das Leben auf der Pad greift die Zähne sehr an und der Zahnarzt ist weit fort auf der Etappe. Mein Sanitätssergeant macht den kümmerlichen Versuch, den Zahn herauszuziehen. Nach mehrmaligem heißen aber vergeblichem Bemühen gibt er den Kampf auf, ohne die Schmerzen darum zu bessern. Arzt hilf dir selber! Zum Trost kommen abends, wie gerufen, einige Wagen mit Liebesgaben, und ich finde Trost am Lagerfeuer bei gutem Kognak und einer guten Zigarre. Die Liebesgaben, die in letzter Zeit auch die Feldtruppen ziemlich reichlich bekommen haben, stammen zum größten Teil aus Baden und Württemberg. Die netten Begleitschreiben, mit gemütlichem Humor gewürzt, beweisen uns, dass unsere Sache daheim doch nicht allen so gleichgültig ist, wie wir manchmal aus den wenigen Notizen der meisten Zeitungen zu schließen glauben.&quot;},{&quot;name&quot;:&quot;Keitsubfarm / Schwarzrand&quot;,&quot;date&quot;:&quot;25.08.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Den Keitsubfluss aufwärts nach Westen bis zur Farm.&quot;,&quot;note&quot;:&quot;Historische Farm nicht sicher lokalisiert.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:748,&quot;quote&quot;:&quot;[Im Schwarzrandgebirge, 25. August 1905.]\n\nAbmarsch der Abteilung von U., zu der wir jetzt gehören, bis zum Keitsubfluß. Diesen aufwärts sind wir heute nach Westen, unserer Marschrichtung für die nächsten Tage, bis zur Keitsubfarm vormarschiert. Sehr schwieriges Gelände; Klippen, Geröll und Felsblöcke, so daß man lange Strecken nur zu Fuß vorwärts kommt, das Rößlein am Zügel führend. Die andern Abteilungen rücken auch, unserer Marschrichtung parallel, vom Leberfluß nach Westen; wir sollen gemeinsam die Hottentotten angreifen, wenn wir sie auf dem Schwarzrandgebirge finden, oder sie vor uns hertreiben weiter nach Westen.&quot;},{&quot;name&quot;:&quot;Schwarzrand, Wassersuche&quot;,&quot;date&quot;:&quot;26.–28.08.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Marsch über Fels und Geröll; am 27. August wird eine kleine Wasserstelle erreicht.&quot;,&quot;note&quot;:&quot;Der Autor schreibt am 28. August selbst, dass ihm der genaue Standort unklar ist.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:752,&quot;quote&quot;:&quot;[Im Schwarzrandgebirge, 26. August 1905.]\n\nWenn man&#x27;s nicht selbst gesehen hat, würde man es nicht glauben, daß auf einem Fleck Erde so viel Geröll, Steine und Felsblöcke zusammengehäuft liegen können. 24 Stunden sind wir nun schon in dieser Steinwüste bergauf und bergab geturnt und geklettert, immer Richtung Westen, haben bis jetzt aber noch kein Wasser gefunden. Eine Menge Tiere haben die Eisen verloren und sich die Beine verstaucht. Einige laufen schon auf dem bloßen Fleisch; der Krankenwagen ist ganz entzwei gebrochen und mußte verbrannt werden. Jetzt machen wir kurze Mittagsrast, brechen aber nach kurzer Zeit wieder auf, da wir bald Wasser finden müssen, wenn unsere Pferde nicht verdurften sollen. Viele frische Lagerstätten der Hottentotten mit Resten ihrer Mähler und Spuren gefunden, aber alles weist nach Westen.&quot;},{&quot;name&quot;:&quot;Kudis, Wasserstelle&quot;,&quot;date&quot;:&quot;28.08.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Passage einer kleinen Wasserstelle, die für die folgende Abteilung freigehalten wird.&quot;,&quot;note&quot;:&quot;Gleichnamige heutige Farmen passen nicht eindeutig zur beschriebenen Tagesetappe.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:766,&quot;quote&quot;:&quot;[Hasaweb-Revier bei Amhub, 29. August 1905.]\n\nGestern nachmittag weiter marschierend trafen wir auf die Wasserstelle Kudis, die wir, da sie auch nicht sehr viel Wasser enthält, für Abteilung E. reservierten, die uns nachfolgt. Bei Tagesanbruch endlich auf das das Schwarzrandgebirge im Westen begrenzende Hasawebrevier gestoßen. Es fällt jedoch so senkrecht steil ab, daß wir den ganzen Vormittag gebrauchten, um eine Abstiegstelle zu finden. Endlich entschieden wir uns für eine Schlucht, in der in der Regenzeit ein Sturzbach eine Rinne heruntergerissen hat. Aber die Schwierigkeiten sind fast unüberwindlich; die Geschütze sind ausgespannt und werden in Teilen, Protze und Lafette getrennt, die 300 m heruntergelassen. Die Reiter sind jetzt gerade dabei, die Karren abzuladen, denn auch diese sollen auf dieselbe Weise in die Tiefe. Die Tiere sind schon unten, alle heil, wenn auch mit manchem gefährlichem Sturz angekommen. Ich liege augenblicklich am Rande des Steilabfalls des Schwarzrandes, bereit, jeden Augenblick ein gebrochenes Glied in Behandlung zu nehmen oder ein versagendes Herz mit einer Kampferspritze wieder zu beleben, denn hier bei 1700 m Höhe mit einem Abfall auf 1400 m, wie Major v. U.s Höhenbarometer anzeigt, muß das Herz bei der angestrengten Arbeit schon etwas vertragen können. Und arbeiten tun die Leute, daß es eine wahre Lust ist, trotz der gehabten Strapazen. Ob Hannibal beim Übergang über die Alpen wohl mehr geleistet hat? Alle Hilfsmittel der Kultur fehlten uns ebenso wie ihm. Unten im Tal ist leider kein Wasser; wir müssen heute abend noch weiter, 22 km nach […]&quot;},{&quot;name&quot;:&quot;Hasaweb-Revier bei Amhub&quot;,&quot;date&quot;:&quot;29.08.1905&quot;,&quot;coord&quot;:[16.81094,-25.34498],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Schwieriger Abstieg über den westlichen Steilrand des Schwarzrandgebirges.&quot;,&quot;note&quot;:&quot;Amhub dient als Ortsbezug; der tatsächliche Abstiegspunkt ist unbekannt.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3358729&quot;,&quot;line&quot;:766,&quot;quote&quot;:&quot;[Hasaweb-Revier bei Amhub, 29. August 1905.]\n\nGestern nachmittag weiter marschierend trafen wir auf die Wasserstelle Kudis, die wir, da sie auch nicht sehr viel Wasser enthält, für Abteilung E. reservierten, die uns nachfolgt. Bei Tagesanbruch endlich auf das das Schwarzrandgebirge im Westen begrenzende Hasawebrevier gestoßen. Es fällt jedoch so senkrecht steil ab, daß wir den ganzen Vormittag gebrauchten, um eine Abstiegstelle zu finden. Endlich entschieden wir uns für eine Schlucht, in der in der Regenzeit ein Sturzbach eine Rinne heruntergerissen hat. Aber die Schwierigkeiten sind fast unüberwindlich; die Geschütze sind ausgespannt und werden in Teilen, Protze und Lafette getrennt, die 300 m heruntergelassen. Die Reiter sind jetzt gerade dabei, die Karren abzuladen, denn auch diese sollen auf dieselbe Weise in die Tiefe. Die Tiere sind schon unten, alle heil, wenn auch mit manchem gefährlichem Sturz angekommen. Ich liege augenblicklich am Rande des Steilabfalls des Schwarzrandes, bereit, jeden Augenblick ein gebrochenes Glied in Behandlung zu nehmen oder ein versagendes Herz mit einer Kampferspritze wieder zu beleben, denn hier bei 1700 m Höhe mit einem Abfall auf 1400 m, wie Major v. U.s Höhenbarometer anzeigt, muß das Herz bei der angestrengten Arbeit schon etwas vertragen können. Und arbeiten tun die Leute, daß es eine wahre Lust ist, trotz der gehabten Strapazen. Ob Hannibal beim Übergang über die Alpen wohl mehr geleistet hat? Alle Hilfsmittel der Kultur fehlten uns ebenso wie ihm. Unten im Tal ist leider kein Wasser; wir müssen heute abend noch weiter, 22 km nach […]&quot;},{&quot;name&quot;:&quot;Kleinfontein&quot;,&quot;date&quot;:&quot;30.–31.08.1905&quot;,&quot;coord&quot;:[16.79278,-25.21246],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Nach einem Nachtmarsch nach Norden endlich Wasser und Ruhe in einer Farm.&quot;,&quot;note&quot;:&quot;Plausible Zuordnung zu Kleinfontein II; historische Farm nicht zweifelsfrei bestätigt.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3356151&quot;,&quot;line&quot;:770,&quot;quote&quot;:&quot;[Kleinfontein, 30. August 1905.]\n\nBis gestern abend ins Dunkle haben wir an dem Herunterbringen der Fahrzeuge gearbeitet, dann marschierten wir noch 4 Stunden nach Norden. Heute morgen endlich zu gutem Wasser gekommen. Wir lagern in einer ausgeraubten Farm, die wir reinigen ließen und bezogen. Ein gemeinsames Wohnzimmer, Schlafzimmer, Küche für die Burschen. Mensch und Pferde haben dringend etwas Ruhe nötig.&quot;},{&quot;name&quot;:&quot;Zaraos am Chambaweb&quot;,&quot;date&quot;:&quot;03.–05.09.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Etwa 60 Kilometer nach Süden entlang des Schwarzrandes. Am 5. September Rückmarschbefehl.&quot;,&quot;note&quot;:&quot;Mögliche Entsprechung Saraus, nicht gesichert; daher kein Kartenpunkt.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:778,&quot;quote&quot;:&quot;[Zaraos am Chambaweb, 3. September 1905.]\n\nUnter heftigen Gewitterregen 60 km entlang den düsteren Abhängen des Schwarzrandes nach Süden reitend, trafen wir heute in diesem von wilden Bergkegeln und Klippen umgebenen Schlupfwinkel der Hottentotten ein. Die Pad ist schwer, für Wagen kaum passierbar, das Wasser gut und klar aus den Felsen herausspringend. Major v. E. reitet morgen, von einem Zuge von uns eskortiert, weiter nach Chamis, wohin er zum Hauptquartier befohlen ist. Hottentotten vor uns zurückgewichen, haben uns einen Ochsen am Wasser stehen gelassen, der gleich geschlachtet wird.&quot;},{&quot;name&quot;:&quot;Kleinfontein&quot;,&quot;date&quot;:&quot;06.09.1905&quot;,&quot;coord&quot;:[16.79278,-25.21246],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Im Gewaltmarsch zurück. Am Nachmittag weiter zu den Zarisbergen.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3356151&quot;,&quot;line&quot;:786,&quot;quote&quot;:&quot;[Kleinfontein, 6. September 1905.]\n\nIm Gewaltmarsch heute nach hier zurückgezogen. Wir sollen uns am westlichen Rande der Zarisberge unter Befehl von Major M. am Rande der Namib vorlegen, um die Hottentotten, die von Norden her gedrängt werden, abzufangen. Für uns gänzlich neue Kriegslage, dabei total schlappe Pferde. Endlich erreicht uns wieder einmal eine liebe Heimatspost. Nachmittags weiter.&quot;},{&quot;name&quot;:&quot;Turlosie / Zarisberge&quot;,&quot;date&quot;:&quot;07.09.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Kurze Rast bei der Farm Turlosie, anschließend Marsch ins Gebirge.&quot;,&quot;note&quot;:&quot;Historische Farm nicht sicher lokalisiert.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:790,&quot;quote&quot;:&quot;[In den Zarisbergen, 7. September 1905.]\n\nHeute morgen kurze Rast bei der ausgeraubten Farm Turlosie. Weitermarsch ins Gebirge, die übliche Verirrungstour in den wilden Bergen, jetzt sind wir wieder auf dem richtigen Weg; dafür aber zur Mittagsrast noch nicht am Wasser. Die Pferde sind äußerst schlapp. Unsere letzte Karre hat einen Rumpler gemacht und sich auf den Kopf gestellt, es scheint aber alles heil geblieben zu sein, nur mein Junge Hans, der darauf saß, hat sich seinen Kaffernschädel gestoßen; er wollte gar nicht gerne wieder aufsteigen.&quot;},{&quot;name&quot;:&quot;Nam&quot;,&quot;date&quot;:&quot;07.–08.09.1905&quot;,&quot;coord&quot;:[16.40625,-25.09683],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Ankunft am Abend des 7. September an einer Farm mit ständigem Bergwasser.&quot;,&quot;note&quot;:&quot;Eine von mehreren benachbarten Nam-Farmen als vorläufiger Ortsbezug.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3355349&quot;,&quot;line&quot;:794,&quot;quote&quot;:&quot;[Nam, 8. September 1905.]\n\nGestern gegen abend hier eingetroffen; die Farm, jetzt zerstört, früher von einem Deutschen bewirtschaftet, ist eine der schönsten, die ich im Schutzgebiet gesehen habe. Wildromantisch zerklüftete Berge umgeben einen großen Talkessel, durch den ein klares, nie versiegendes Bergwässerlein fließt. Das Farmhaus war gut gebaut und besaß reichlichen Viehbestand. Glück im Unglück hat der Farmer gehabt; er hat sich mit seiner jungen Frau nach Maltahöhe retten können und seine Aussteuer stand noch unausgepackt im Hafen von Lüderitzbucht. Leider haben hier die Farmer wenig Sinn für landschaftliche Schönheit; auch hier hat der Besitzer in der Nähe fast alle großen Bäume abgeschlagen und verbraucht, sonst hätte er in der Nähe des Hauses an dem Bächlein entlang einen wundervollen Park herrichten können. Kurz, ein Ort, an dem man sich&#x27;s wohl sein lassen kann. Daraus wird aber für uns nichts werden, denn wir müssen vorwärts in die Namibwüste. Dann sind wir hinter den Hottentotten her von der Kalahari bis zur Namib, von einer Wüste zur andern. Heute morgen weckt uns wüstes unartikuliertes Gebrüll. R. war mit seinen Kamelen, die auch mit von der Expedition sein sollen, eingetroffen und hatte dicht neben dem unsrigen seinen Lagerplatz aufgeschlagen. Die Tiere geben als Morgengesang schreckliche Laute von sich. Eines hatte einen schwer eiternden Druck vom Tragsattel, und R. bat mich, es zu behandeln. So hatte ich denn heute früh Gelegenheit, die Funktion eines „vierbeinigen Kollegen“ zu übernehmen. Mein Patient benahm sich verhältnismäßig gesittet, nur versuchte […]&quot;},{&quot;name&quot;:&quot;Namib, westlich der Zarisberge&quot;,&quot;date&quot;:&quot;09.–10.09.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Nachtmarsch ins Flugsandgebiet, danach nach Norden zurück in die Berge; ergebnisloser Vorstoß.&quot;,&quot;note&quot;:&quot;Nur der Bewegungsraum ist belegt, keine präzise Marschlinie.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:798,&quot;quote&quot;:&quot;[In der Namib, 10. September 1905.]\n\nAm Abend und in der Nacht durch die schönen Zarisberge marschiert, bis wir mitten in dem bekannten Flugsandgebiet der Küstenwüste waren. Gegen Morgen unter Führung eines Eingeborenen nach Norden in die Berge zurück. Die Nordabteilung sollte die Schlucht, in der sich die Hottentotten befanden, von Osten her angreifen, während wir uns im Westen vorlegten. Es war ein tüchtiger Marsch und wir todmüde, als die Sonne aufging. Als wir an den Bergen waren, wurde abgesessen und wir kletterten 4 Stunden über Klippen und Felsblöcke.\n\nWir haben aber weder die Hottentotten noch die Nordabteilung gefunden; der Kerl von Führer hat uns entweder absichtlich oder unabsichtlich in die Irre geführt, und schließlich mußten wir vor einer steilen Wand, vollständig erschöpft, Halt machen. Mit wundgelaufenen Füßen und müden Knochen ging&#x27;s zurück. Jetzt sind wir wieder bei unseren Pferden eingetroffen.&quot;},{&quot;name&quot;:&quot;Zarisberge, Nordabteilung&quot;,&quot;date&quot;:&quot;11.–12.09.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Nächtlicher Anschluss an die Nordabteilung und Vorbereitung eines neuen Angriffs.&quot;,&quot;note&quot;:&quot;Lagerpunkt nicht angegeben.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:804,&quot;quote&quot;:&quot;[In den Zarisbergen, 11. September 1905.]\n\nGestern abend traten wir den Rückmarsch an und waren um Mitternacht todmüde halbwegs, eben hatte ich mich mit P. am Lagerfeuer zu kurzer Ruhe in die Decke gewickelt, da gab&#x27;s wieder Alarm. Aufsatteln. Die Nordabteilung hat mit den Hottentotten ein kurzes Gefecht gehabt. Wir waren nicht weit genug vormarschiert und die Hottentotten weiter zurückgewichen. Jetzt ging&#x27;s zur Nordabteilung. Das war ein Ritt! Die zweite Nacht kein Auge geschlossen, ein Tag äußerster Anstrengung dazwischen. Viele waren so müde, daß sie auf den Pferden einschliefen. Bitter kalt war&#x27;s. Dicke weiße Nebelschwaden zogen vom Meere mit dem Seewind herüber. Eisstücke hingen meinem Pferde am Gebiß. Als die Sonne aufging, waren wir an der Stelle, wo Major M. mit seinen Kompagnien lag. Wir konnten uns kaum noch auf den Beinen halten und viele sanken an den schnell angemachten wärmenden Feuern um. Die Pferde wurden 6 Stunden nach Nam zur Tränke zurückgetrieben. Jetzt ist es Abend. Einigermaßen ausgeruht haben wir erfahren, daß der Vorstoß noch einmal gemacht werden soll. Diesmal ist die 4. Kompagnie bei der Nordabteilung und wir machen den Marsch von der anderen Seite mit.&quot;},{&quot;name&quot;:&quot;Rubib&quot;,&quot;date&quot;:&quot;13.–19.09.1905&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Angriff auf eine bewohnte Werft, Gefangennahmen und Zerstörung. Ortenberg versorgt Verwundete und berichtet auch von eigener Beteiligung am Schießen. Danach Versorgungskrise.&quot;,&quot;note&quot;:&quot;Gefechts- und Lagerplatz nicht sicher lokalisiert. Keine Gleichsetzung allein aufgrund ähnlich klingender Bergnamen.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:808,&quot;quote&quot;:&quot;[Rubib, 13. September 1905.]\n\nGestern abend Aufstieg in die Berge. Die Pferde blieben mit einer Wache zurück. Als einziges Tier ging ein Sanitätsmaultier mit, das uns später in dem überaus schwierigen Gelände die steilsten Felsen hinauf ganz vorzüglich folgte. Ohne Mantel, ohne Decken, froren wir erbärmlich beim eisigen Gebirgswind. Diese afrikanischen Berge sind wunderbar grotesk und eigenartig in ihrer Gestaltung. Steile himmelanstrebende Felsen, tiefe Schluchten, große Felder mit weiß glänzendem Quarzgeröll bedeckt, darüber das bleiche, fahle Mondlicht. Ein Mann hinter dem andern erstiegen wir in langem Gänsemarsch den Bergstock, sieben Stunden lang. Um 3 1/2 Uhr plötzlich halt! Dort drüben vor uns an einem langen Berghang Blinkfeuer, ca. 50 bis 60 Feuerstellen, die bei dem scharfen Morgenwind hell aufflackerten. Das ist die lange gesuchte Werft! Nun aber leise, keinen Laut mehr gesprochen! Die Kerle scheinen noch zu schlafen. Allmählich graut der Morgen. Leise sind wir näher geschlichen, gerutscht und gekrochen. Das uns von der Werft trennende Gelände ist unendlich schwierig. Die ersten Sonnenstrahlen beleuchten rot, schimmernd die große Werft, während wir ganz im Schatten liegend immer weiter vordringen. Jetzt haben wir die letzte Höhe erreicht, zwischen uns und dem Feind liegt nur noch eine etwa 100 m tiefe Schlucht; mit dem Glase erkennt man, wie die Werft dick voll Menschen ist! Die meisten liegen um die Feuer und schlafen, einige sind gerade aufgestanden und recken sich in der Morgen Sonne. Die Weiber gehen zum Vieh mit Milchgefäßen. Heute ist Vollmond gewesen, […]&quot;},{&quot;name&quot;:&quot;Rückmarsch nach Zaris&quot;,&quot;date&quot;:&quot;19.–20.09.1905&quot;,&quot;coord&quot;:[16.37192,-24.94597],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Zu Fuß über eine Wasserscheide; die geschwächten Pferde werden vorausgetrieben.&quot;,&quot;note&quot;:&quot;Koordinate der heutigen Farm Zaris nur als Zielbezug. Am 20. September ist erst eine Rast unterwegs belegt.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3351996&quot;,&quot;line&quot;:840,&quot;quote&quot;:&quot;[In den Zarisbergen, 20. September 1905.]\n\nDen schwierigsten Teil des Marsches haben wir, über eine hohe Wasserscheide kletternd, überwunden. Jetzt liegen wir als ehrsame Infanteristen zur Mittagsrast im jenseitigen Tal, während die Pferde im hohen Gras des Berghanges weiden. Unterwegs sind noch neun Pferde liegen geblieben.\n\nÜbrigens hat die Schlappe bei Rubib den Hottentotten einen heilsamen Schrecken eingejagt. Gefangene erzählen, daß sie diese für ihre größte Niederlage im Süden hielten. Sie hätten gerade eine Hochzeit gefeiert, und wir hätten ihnen das Erwachen gründlich verdorben.&quot;},{&quot;name&quot;:&quot;Karichab am Hudup&quot;,&quot;date&quot;:&quot;04.10.1905&quot;,&quot;coord&quot;:[17.11789,-24.8281],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Lager am Fluss mit Weide und Wasser.&quot;,&quot;note&quot;:&quot;Farmkoordinate als Ortsbezug.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3356330&quot;,&quot;line&quot;:846,&quot;quote&quot;:&quot;[Karichab, 4. Oktober 1905.]\n\nWir glaubten einige Tage Ruhe zu haben, aber jetzt sind wir schon wieder auf dem Marsche hinter versprengten Hottentotten her.\n\nWir haben unser Lager ein bißchen sehr nahe am Wasser aufgeschlagen. Die Moskitos, die in den jetzt schon wieder ganz warmen Nächten stark schwärmen, belästigen einen sehr. Es ist aber trotz der Malariagefahr zu verführerisch, abends beim Silberschein des Mondes am Fluße zu sitzen und den ewig gleichen, melancholischen Geräuschen der afrikanischen Nacht zu lauschen, die hier noch durch das lustige Plätschern großer Fische, die in der klaren Flut des Hudup ihr Abendspiel treiben, begleitet werden. Unseren wenigen Pferden bekommt die gute Weide und das tägliche Bad ausgezeichnet, und auch uns ist das viele Wasser ein ungewohnter Genuß. Heute, beim Morgenbade, hatte ich ein komisches Erlebnis. Als ich gerade heute morgen in aller afrikanischen Ungeniertheit unter den Bäumen in meiner als Badewanne zurechtgemachten Zeltbahn sitze, umsteht mich plötzlich eine Schar unserer bei Rubib gefangenen Hottentottenschönen, die beim Holzsammeln waren, und lachen und schwatzen eifrig über die ihnen wohl gänzlich unerklärliche Prozedur, daß ein Orlogmann einmal Bedürfnis nach Wasser hat. Bei ihren Eheherren im Zarisgebirge sind sie das wohl nicht gewohnt gewesen. Sie waren auch gar nicht fortzubringen; und erst ein paar Steinwürfe belehrte sie, daß ich mein europäisches Gleichgewicht höher schätzte, als seine vielgerühmte Höflichkeit.&quot;},{&quot;name&quot;:&quot;Sandverhaar&quot;,&quot;date&quot;:&quot;spätestens 21.–31.12.1905&quot;,&quot;coord&quot;:[17.40595,-26.84128],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Seit einiger Zeit am Baiweg. Versorgungsprobleme, Weihnachten im Lager; am 31. Dezember bleibt der erkrankte Autor zurück.&quot;,&quot;note&quot;:&quot;Ankunftstag fehlt. Der südliche Ort am Baiweg ist gemeint; bestätigt durch historischen DWD-Stationsbezug.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3353284&quot;,&quot;line&quot;:852,&quot;quote&quot;:&quot;[Sandverhaar, 21. Dezember 1905.]\n\nAuf dem Marsch nach Süden haben wir den Bayweg bei Sandverhaar erreicht, und liegen nun schon eine ganze Zeit hier. Wir liegen unter einem furchtbar heißen Zelt, lassen uns den feinen Sand durch den Wind in die Augen treiben und langweilen uns. Die Proviantzufuhr ist sehr knapp und unregelmäßig, da die meisten Frachten an uns vorbei nach Keetmanshoop und zu Major v. E. gehen. Auf Hafer und Genußmittel können wir schon gar nicht mehr rechnen. Das ist die Folge der großen Unterlassungssünden des Reichstages!\n\nHätten wir jetzt die Bahn, die schon über ein Jahr fertig sein könnte, würde das nicht vorkommen.\n\nUnsere Unternehmungen sind einfach lahm gelegt, die Pferde gehen bei mangelndem Futter haufenweise ein; wir bekommen schon wenig zu essen, noch schlimmer wird es im Süden stehen. Und dabei kostet die Unterhaltung des ganzen Kolonnen- und Fuhrwesens auf dem Bayweg monatlich 22000000 Mark! Wenn man so wenig Unterstützung von den berufenen Vertretern zu Hause findet, soll man da nicht selbst mißmutig werden. Die Rechnung stimmt nicht, deutscher Reichstag!\n\nIn der Kompagnie beginnt der alte Feind Skorbut wieder auszubrechen, auch mein und P.s Zahnfleisch ist bläulich gefärbt. Die Kompagnie wird verwandt, um in kleinen Trupps Ochsenwagen den Bayweg entlang zu begleiten.&quot;},{&quot;name&quot;:&quot;Lüderitzbucht, geplanter Abtransport&quot;,&quot;date&quot;:&quot;nach 31.12.1905 geplant&quot;,&quot;coord&quot;:[15.15383,-26.64807],&quot;kind&quot;:&quot;Geplant&quot;,&quot;summary&quot;:&quot;Eine Telegrafenkarre soll den erkrankten Autor nach Lüderitzbucht bringen.&quot;,&quot;note&quot;:&quot;Der Text endet vor der Fahrt. Ankunft und tatsächlicher Transport sind nicht belegt.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3355672&quot;,&quot;line&quot;:866,&quot;quote&quot;:&quot;[Sandverhaar, 31. Dezember 1905.]\n\nDie Kompagnie soll wieder über Bethanien nach Norden, um Cornelius aufzusuchen.\n\nIch reite nicht mehr mit, da ich erkrankt bin. Mein Herz ist nicht mehr in Ordnung, und ein Hüftgelenk, durch einen Sturz mit dem Pferde neu gequetscht, hat Ruhe nötig. Es ist gerade ein Jahr her, daß ich zur Kompagnie kam. Ein kurzer Abschied von den liebgewordenen Kriegskameraden, ein kurzes Kommando, die Kompagnie reitet ab. Ich bin allein und denke des vergangenen Jahres mit all seinem Freud und Leid. Eine Telegraphenkarre wird mich mit meinem Anhang, Burschen, Bambussen und Koffern nach Lüderitzbucht bringen.&quot;}],&quot;countries&quot;:[{&quot;type&quot;:&quot;Feature&quot;,&quot;properties&quot;:{&quot;name&quot;:&quot;Zimbabwe&quot;},&quot;geometry&quot;:{&quot;type&quot;:&quot;Polygon&quot;,&quot;coordinates&quot;:[[[31.28611,-22.4025],[31.19611,-22.34521],[31.07371,-22.30702],[30.91531,-22.29139],[30.71011,-22.29834],[30.4617,-22.32959],[30.1917,-22.29139],[29.9037,-22.18376],[29.6625,-22.14557],[29.37809,-22.19244],[29.36369,-22.19418],[29.31689,-22.15772],[29.23769,-22.0796],[29.10809,-22.06571],[29.07209,-22.04662],[29.04329,-22.01884],[29.02169,-21.98065],[29.01449,-21.94072],[29.03609,-21.81052],[29.02529,-21.79663],[28.98929,-21.78101],[28.92089,-21.76538],[28.74809,-21.7081],[28.53209,-21.65081],[28.18288,-21.59005],[28.04608,-21.57269],[28.01368,-21.55359],[27.97408,-21.50672],[27.90568,-21.35916],[27.84448,-21.26194],[27.69328,-21.11091],[27.66808,-21.06404],[27.67528,-20.94425],[27.68968,-20.84877],[27.70408,-20.76718],[27.69688,-20.68906],[27.69328,-20.59532],[27.70048,-20.53109],[27.67888,-20.50331],[27.62488,-20.48421],[27.47007,-20.47553],[27.27927,-20.47901],[27.27567,-20.38179],[27.25767,-20.23249],[27.22167,-20.14569],[27.17847,-20.10056],[27.09207,-20.05368],[26.91567,-19.98945],[26.67807,-19.89224],[26.47286,-19.74815],[26.24246,-19.56934],[26.16686,-19.53809],[26.08046,-19.3697],[25.95086,-19.08152],[25.95806,-18.98604],[25.94006,-18.
