    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;ortenberg-map&quot;&gt;
  &lt;style&gt;
    #ortenberg-map {color:var(--foreground);font-family:var(--font-sans);width:100%;}
    #ortenberg-map .om-heading {display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
    #ortenberg-map h2,#ortenberg-map p {margin:0;}
    #ortenberg-map .om-tools {display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;}
    #ortenberg-map button,#ortenberg-map select {color:var(--foreground);background:var(--background);border:1px solid var(--border);border-radius:5px;padding:7px 10px;font:inherit;}
    #ortenberg-map button {cursor:pointer;}
    #ortenberg-map button:disabled {opacity:.45;cursor:default;}
    #ortenberg-map select {width:100%;min-width:0;max-width:100%;}
    #ortenberg-map .om-map {position:relative;overflow:hidden;border:1px solid var(--border);}
    #ortenberg-map svg {display:block;width:100%;touch-action:none;}
    #ortenberg-map svg text {fill:var(--foreground);font-size:12px;paint-order:stroke;stroke:var(--background);stroke-width:3px;stroke-linejoin:round;}
    #ortenberg-map .om-legend {display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;}
    #ortenberg-map .om-key {display:inline-flex;align-items:center;gap:6px;}
    #ortenberg-map .om-dot {width:9px;height:9px;border-radius:50%;background:var(--viz-series-1);display:inline-block;}
    #ortenberg-map .om-hollow {background:var(--background);border:2px solid var(--viz-series-2);box-sizing:border-box;}
    #ortenberg-map .om-dash {width:22px;height:0;border-top:2px dashed var(--foreground);}
    #ortenberg-map .om-detail {border-top:1px solid var(--border);padding-top:12px;display:grid;gap:7px;}
    #ortenberg-map .om-meta {display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
    #ortenberg-map .om-note {color:var(--muted-foreground);}
    #ortenberg-map blockquote {margin:8px 0;padding:8px 12px;border-left:2px solid var(--border);white-space:pre-wrap;overflow-wrap:anywhere;}
    #ortenberg-map details {margin-top:4px;}
    #ortenberg-map summary {cursor:pointer;}
    #ortenberg-map a {color:var(--primary);overflow-wrap:anywhere;}
    #ortenberg-map .om-status {min-height:1.5em;}
    #ortenberg-map input[type=range] {width:100%;accent-color:var(--viz-series-1);margin:6px 0;}
    @media(max-width:480px){#ortenberg-map .om-tools button{padding:9px;} #ortenberg-map .om-heading{display:block;} }
  &lt;/style&gt;
  &lt;div class=&quot;om-heading&quot;&gt;&lt;h2&gt;Heinz von Ortenberg · Südwestafrika&lt;/h2&gt;&lt;span class=&quot;text-small&quot;&gt;Juni 1904 bis Dezember 1905&lt;/span&gt;&lt;/div&gt;
  &lt;label for=&quot;om-station&quot; class=&quot;text-small&quot;&gt;Reisechronik&lt;/label&gt;
  &lt;select id=&quot;om-station&quot; aria-label=&quot;Station der Reise auswählen&quot;&gt;&lt;/select&gt;
  &lt;div class=&quot;om-tools&quot;&gt;
    &lt;button id=&quot;om-prev&quot; type=&quot;button&quot; aria-label=&quot;Vorherige Station&quot;&gt;←&lt;/button&gt;
    &lt;button id=&quot;om-next&quot; type=&quot;button&quot; aria-label=&quot;Nächste Station&quot;&gt;→&lt;/button&gt;
    &lt;button id=&quot;om-play&quot; type=&quot;button&quot;&gt;Abspielen&lt;/button&gt;
    &lt;span id=&quot;om-count&quot; class=&quot;text-small tabular-nums&quot;&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;input id=&quot;om-time&quot; type=&quot;range&quot; min=&quot;0&quot; value=&quot;0&quot; aria-label=&quot;Chronologisch durch die Stationen gehen&quot;&gt;
  &lt;div class=&quot;om-map&quot;&gt;&lt;svg id=&quot;om-svg&quot; role=&quot;img&quot; aria-label=&quot;Interaktive Karte der belegten Reiseetappen im heutigen Namibia&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
  &lt;div class=&quot;om-tools&quot;&gt;
    &lt;button id=&quot;om-in&quot; type=&quot;button&quot; aria-label=&quot;Karte vergrößern&quot;&gt;+&lt;/button&gt;
    &lt;button id=&quot;om-out&quot; type=&quot;button&quot; aria-label=&quot;Karte verkleinern&quot;&gt;−&lt;/button&gt;
    &lt;button id=&quot;om-fit&quot; type=&quot;button&quot;&gt;Gesamtansicht&lt;/button&gt;
    &lt;button id=&quot;om-focus&quot; type=&quot;button&quot;&gt;Station vergrößern&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;om-legend text-small&quot;&gt;
    &lt;span class=&quot;om-key&quot;&gt;&lt;i class=&quot;om-dot&quot;&gt;&lt;/i&gt;Ortsbezug&lt;/span&gt;
    &lt;span class=&quot;om-key&quot;&gt;&lt;i class=&quot;om-dot om-hollow&quot;&gt;&lt;/i&gt;Vorläufige Zuordnung&lt;/span&gt;
    &lt;span class=&quot;om-key&quot;&gt;&lt;i class=&quot;om-dash&quot;&gt;&lt;/i&gt;Lücke / unbekannte Zwischenstation&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;om-detail&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;om-meta&quot;&gt;&lt;strong id=&quot;om-title&quot;&gt;&lt;/strong&gt;&lt;span id=&quot;om-date&quot; class=&quot;text-small&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;p id=&quot;om-summary&quot;&gt;&lt;/p&gt;
    &lt;p id=&quot;om-status&quot; class=&quot;om-status text-small&quot;&gt;&lt;/p&gt;
    &lt;p id=&quot;om-note&quot; class=&quot;om-note text-small&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;details id=&quot;om-quote-box&quot;&gt;&lt;summary&gt;Originalauszug aus dem Tagebuch&lt;/summary&gt;&lt;blockquote id=&quot;om-quote&quot; class=&quot;text-small&quot;&gt;&lt;/blockquote&gt;&lt;div id=&quot;om-reference&quot; class=&quot;text-small&quot;&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary class=&quot;text-small&quot;&gt;Kartengrundlage und Grenzen der Rekonstruktion&lt;/summary&gt;
    &lt;div class=&quot;text-small&quot; style=&quot;display:grid;gap:8px;margin-top:8px&quot;&gt;
      &lt;p&gt;Grundlage: H. von Ortenberg, „Aus dem Tagebuch eines Arztes. Feldzugsskizzen aus Südwestafrika“, 1907, übergebene Transkription. Auszüge sind unverändert und können Übertragungsfehler sowie rassistische koloniale Bezeichnungen enthalten.&lt;/p&gt;
      &lt;p&gt;Die Linien verbinden Aufenthalte in zeitlicher Folge. Sie zeigen keine vermessenen Marschwege, Bahntrassen oder Straßen. Kleine Ausflüge ohne benannten Ort sind nicht als eigene Stationen erfasst. Wiederholte Aufenthalte erscheinen einzeln in der Chronik. Die graue Linie zeigt die gesamte Rekonstruktion, die farbige Linie den Verlauf bis zur ausgewählten Station.&lt;/p&gt;
      &lt;p&gt;23 Stationen ohne hinreichend gesicherte Lage bleiben in der Chronik auswählbar, erhalten aber keinen erfundenen Kartenpunkt. Farmkoordinaten bezeichnen heutige Ortsbezüge, nicht zwingend damalige Gebäude. Besonders Mukorab, Nam und Kleinfontein bleiben vorläufige Zuordnungen. Die Karte zeigt heutige Geografie und Landesgrenzen.&lt;/p&gt;
      &lt;p&gt;Lüderitzbucht ist ausschließlich als geplanter Abtransport eingezeichnet. Bethanien ist am Schluss ein Ziel der ohne den Autor abziehenden Kompanie. Waterberg, Okahandja und andere nur aus Berichten bekannte Orte werden nicht als seine Aufenthalte gewertet.&lt;/p&gt;
      &lt;p&gt;Koordinaten: &lt;a href=&quot;https://download.geonames.org/export/dump/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GeoNames, Namibia-Datensatz&lt;/a&gt; (CC BY 4.0), historische Stationen nach &lt;a href=&quot;https://www.dwd.de/EN/ourservices/overseas_stations/overseas_documentation/list_overseas_pdf.pdf?__blob=publicationFile&amp;amp;v=9&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Deutschem Wetterdienst&lt;/a&gt;. Flüsse und Landesumrisse: &lt;a href=&quot;https://www.naturalearthdata.com/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Natural Earth&lt;/a&gt; (Public Domain), Länder über world-atlas 2.0.2.&lt;/p&gt;
    &lt;/div&gt;

  &lt;script&gt;
  (()=&gt;{
    const root=document.getElementById(&#x27;ortenberg-map&#x27;);
    const data={&quot;stops&quot;:[{&quot;name&quot;:&quot;Swakopmund&quot;,&quot;date&quot;:&quot;11.–12.06.1904&quot;,&quot;coord&quot;:[14.52663,-22.67842],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Ankunft auf der Reede am 11. Juni; Landung am 12. Juni. Anschließend Dienst im Lazarett.&quot;,&quot;note&quot;:&quot;Landung rückblickend im Eintrag vom 13. Juni bestätigt.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3352844&quot;,&quot;line&quot;:167,&quot;quote&quot;:&quot;[11. Juni.]\n\n12 Uhr mittags. Endlich wird Land sichtbar. Erst ganz fern im Osten ein gelber Schein, dann wird er immer deutlicher, unser deutscher Boden. Bald kann man unterscheiden, daß draußen auf der Reede vier Dampfer liegen. Der erste ist unsere „Montevideo“ mit den Pferden. Jetzt gleiten wir an ihr vorüber und ein kräftiges Hurra von drüben empfängt uns. Dann gehen wir vor Anker. Zirka drei Kilometer von uns liegt die gelbe Sandküste, allmählich sanft aus dem Meere ansteigend, dahinter hohe Sanddünen. Auch eine kleine Kolonie von Häusern, ungefähr 50—60, ist zu sehen, mit einer Art Kirche und verschiedenen anderen großen Häusern. Alle haben, ebenso wie die Dampfer, zur Begrüßung geflaggt. Die Mole springt weit ins Meer hinein vor, an ihr schlägt eine wilde Brandung. Einige endlose Stunden müssen wir warten. Es ist uns signalisiert, daß wegen der starken Brandung kein Boot bis gegen Abend abfahren kann. Endlich kommt ein Dampfboot von der Küste. Major v. G. mit einigen anderen Offizieren. Er sieht sehr elend und schmal aus, eine kleine, aber energisch elastische Soldatenfigur. Es sind wenig neue Nachrichten von dem Kriegsschauplatz da. Der Gouverneur hat gestern telegraphiert, daß er beabsichtigt, sobald wie möglich loszuschlagen, da er augenblicklich „durch Krankheit mehr verlöre, als in 40 blutigen Schlachten“! Auch sonst wird uns wenig Erfreuliches mitgeteilt. Mangel an Truppen, Proviant, Pferden an allen Ecken. Die Operationen ruhen fast vollständig, dazu Krankheit.\n\nInzwischen sind auch unsere Befehle angekommen. Ich bleibe mit drei Mann im Lazarett in […]&quot;},{&quot;name&quot;:&quot;Nonidas&quot;,&quot;date&quot;:&quot;15.06.1904&quot;,&quot;coord&quot;:[14.63385,-22.61269],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Zweistündiger Ritt zum Pferdedepot und zur Wasserstelle im Swakop.&quot;,&quot;note&quot;:&quot;Heutiger Ortsbezug; der Standort des damaligen Depots ist nicht vermessen.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3355108&quot;,&quot;line&quot;:193,&quot;quote&quot;:&quot;[15. Juni 1904.]\n\nHeute einen zweistündigen Ritt nach Nonidas, einem Pferdedepot östlich von Swakopmund, gemacht. Ich hatte mir einen sehr hübschen Ostpreußen aus dem Kraal ziehen lassen. Die Tiere sind aber noch gar nicht zugeritten und deshalb das Reiten etwas schwierig. Ich begleitete Herrn W., der dort zu tun hatte, mit Oberleutnant v. M., die beide mit einem schwerfälligen, zweirädrigen Karren fuhren. Das Land nimmt mehr östlich einen ziemlich steilen und bergigen Charakter an, mit vielen Felsen und Klippen. Unser Weg führte uns an dem mitten im Sande steckengebliebenen Wüstenautomobil vorbei, das die Firma Trost hierher geschafft hatte, in der Hoffnung, damit Frachten ins Innere befördern zu können. Weiterhin an den Pestbaracken vorüber, die zum Glück jetzt leer stehen. Das steckengebliebene Dampfroß hat der Swakopmunder Volkswitz den „Luther“ getauft: „Hier stehe ich, ich kann nicht weiter!“ Eine sehr treffende Bezeichnung. Man sagt, Trost wolle jetzt auf der anderen Seite einen „Melanchthon“ aufbauen.\n\nNonidas ist eine Wasserstelle in dem sonst trockenen Swakop. Dort befindet sich ein Pferdedepot unter einem Veterinär, der einsam in einer wilden Felsenburg, der „Festung“ haust.&quot;},{&quot;name&quot;:&quot;Swakopmund&quot;,&quot;date&quot;:&quot;ab 16.06.1904&quot;,&quot;coord&quot;:[14.52663,-22.67842],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Wieder Dienst in Swakopmund und im Truppenlager.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3352844&quot;,&quot;line&quot;:199,&quot;quote&quot;:&quot;**[16. Juni.]**\n\nHeute morgen sind zehn gefangene Herero weggelaufen. Sie hatten sich in der Nacht ein Loch unter ihrer Bretterbaracke gegraben und waren in der Nacht entwichen. Und wieder sind es die Engländer, die uns bei Ergreifung der Ausreißer im Wege stehen. Diese hatten sich viele Mühe gegeben und waren 2 km weit ins englische Gebiet hinein rückwärts gegangen, so daß die Fußspitzen der Spur nach Swakopmund zeigten, aber eine danebenlaufende Hundespur hat sie erkenntlich gemacht. Oberleutnant M. war heute morgen in aller Frühe nach Walfischbai hinübergeritten um einige fortgelaufene Pferde dort abzuholen. Der fand auch unsere Ausreißer schon dort an, ganz vergnüglich ihn angrinsend und bei einem reichlichen Frühstück beschäftigt, das ihnen die Engländer vorgesetzt hatten. Sie werden dort so lange frei verpflegt, bis eine genügende Menge zusammen ist, die dann nach der Kapkolonie transportiert wird. Ein früherer Transport sollte ihnen aber nicht gelingen. Den haben sie auf einem deutschen Dampfer verfrachtet, der jetzt Weisung erhalten hat, in Lüderitzbucht die ganzen 60 Mann wieder an Land zu setzen. Da werden sie schon einen gehörigen Denkzettel für ihr Ausreißen bekommen. Vielleicht wird der Trick das zweitemal auch gelingen. Die Walfischbai fehlt uns überhaupt in jeder Hinsicht. Für unsere Reede haben wir trübe Aussichten, da sie in letzter Zeit so versandet ist, daß die Landungsdampfer schon einen großen Bogen machen müssen. Heute wurden eifrig Ochsen aus dem Kapdampfer ausgeladen, da Deutschland für jeden Tag länger als 3 Tage, den der englische Dampfer hier […]&quot;},{&quot;name&quot;:&quot;Walfischbai / Walvis Bay&quot;,&quot;date&quot;:&quot;27.–28.06.1904&quot;,&quot;coord&quot;:[14.50528,-22.9575],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Besuch mit Übernachtung in Walfischbai; am 28. Juni Rückritt am Strand.&quot;,&quot;note&quot;:&quot;Der 27. Juni ergibt sich aus dem Rückblick vom 28. Juni. Damals britisches Gebiet.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3359638&quot;,&quot;line&quot;:249,&quot;quote&quot;:&quot;**[28. Juni.]**\n\nHeute mittag 12 1/3 Uhr von der Walfischbai zurückgekommen. Das war ein scharfer Ritt. Wir brachen heute um 7 1/3 Uhr auf und mußten, einige kurze Strecken abgesehen, auf denen wir die Pferde des tiefen Sandes wegen führen mußten, fast dauernd Trab reiten, damit uns nicht die Flut von dem glatten Strand weg in die tiefen Sanddünen trieb.\n\nDie Walfischbai ist ein ideal gelegener Hafen, wie man ihn nicht besser wünschen kann. Die See darin spiegelglatt, ohne irgendeine Welle, während von draußen her die Brandung brüllt, so daß man drinnen ruhig mit einem kleinen Boot fahren kann. Dazu das Klima viel milder und lauer als in Swakopmund. Das wäre ein Hafen für uns, den wir jetzt brauchen könnten! Und damals, als wir Sansibar und Angra Pequena weggaben, hätten wir die Bay so leicht bekommen können. Von Versanden keine Rede. Ein Kriegsschiff liegt ziemlich dicht am Strande und ist von der sehr kurzen Holzmole leicht zu erreichen. Wir und unsere Pferde kamen in der Nacht ganz gut in dem deutschen Store von Mertens und Sichel unter, wurden dort sehr liebenswürdig aufgenommen.\n\nDie erste Frage war, ob es wahr sei, daß Trotha schon gefangen und getötet sei, wie die Hereros erzählten. Auch so eine Story, an dem kein wahres Wort. Die Engländer haben alles mögliche für ihr Land getan. Das Gouvernement macht einen sehr sauberen und netten Eindruck, wie überhaupt alle Häuser. Es liegen nicht so gräßlich viel Flaschen und Konservendosen herum, wie in Swakopmund. Durch ihr ganzes Gebiet ist eine Bahn gelegt, um den Handel anzuziehen, was ihnen jedoch nicht gelungen ist, so […]&quot;},{&quot;name&quot;:&quot;Swakopmund&quot;,&quot;date&quot;:&quot;28.06.–21.07.1904&quot;,&quot;coord&quot;:[14.52663,-22.67842],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Rückkehr am Mittag des 28. Juni und weitere Arbeit im Lazarett.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3352844&quot;,&quot;line&quot;:249,&quot;quote&quot;:&quot;**[28. Juni.]**\n\nHeute mittag 12 1/3 Uhr von der Walfischbai zurückgekommen. Das war ein scharfer Ritt. Wir brachen heute um 7 1/3 Uhr auf und mußten, einige kurze Strecken abgesehen, auf denen wir die Pferde des tiefen Sandes wegen führen mußten, fast dauernd Trab reiten, damit uns nicht die Flut von dem glatten Strand weg in die tiefen Sanddünen trieb.\n\nDie Walfischbai ist ein ideal gelegener Hafen, wie man ihn nicht besser wünschen kann. Die See darin spiegelglatt, ohne irgendeine Welle, während von draußen her die Brandung brüllt, so daß man drinnen ruhig mit einem kleinen Boot fahren kann. Dazu das Klima viel milder und lauer als in Swakopmund. Das wäre ein Hafen für uns, den wir jetzt brauchen könnten! Und damals, als wir Sansibar und Angra Pequena weggaben, hätten wir die Bay so leicht bekommen können. Von Versanden keine Rede. Ein Kriegsschiff liegt ziemlich dicht am Strande und ist von der sehr kurzen Holzmole leicht zu erreichen. Wir und unsere Pferde kamen in der Nacht ganz gut in dem deutschen Store von Mertens und Sichel unter, wurden dort sehr liebenswürdig aufgenommen.\n\nDie erste Frage war, ob es wahr sei, daß Trotha schon gefangen und getötet sei, wie die Hereros erzählten. Auch so eine Story, an dem kein wahres Wort. Die Engländer haben alles mögliche für ihr Land getan. Das Gouvernement macht einen sehr sauberen und netten Eindruck, wie überhaupt alle Häuser. Es liegen nicht so gräßlich viel Flaschen und Konservendosen herum, wie in Swakopmund. Durch ihr ganzes Gebiet ist eine Bahn gelegt, um den Handel anzuziehen, was ihnen jedoch nicht gelungen ist, so […]&quot;},{&quot;name&quot;:&quot;Rössing&quot;,&quot;date&quot;:&quot;22.07.1904&quot;,&quot;coord&quot;:[14.86667,-22.51667],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Bahnfahrt zur Station Rössing. Von dort allein zu einem schwer verletzten Unteroffizier weitergeritten.&quot;,&quot;note&quot;:&quot;Datum aus dem Eintrag vom 24. Juli; Koordinate der Bahnstation, nicht der Mine.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3353425&quot;,&quot;line&quot;:341,&quot;quote&quot;:&quot;[Swakopmund, 24. Juli 1904.]\n\nHeute Mittag, verstaubt und verbrannt von der Sonne, von einer 3tägigen Expedition zurückgekommen. In der Nacht vom 21./22., als ich mich eben schlafen gelegt hatte, bekam ich ein Telegramm vom Hauptmann E.; er hat auf der Fahrt von Rössing nach Arisakos, 40 Kilometer von der Bahnstation, mit seinem Automobilzug, den er auf Befehl des Hauptquartiers mit unendlichen Schwierigkeiten nach Okahandja hinaufbringt, seinen Pionierunteroffizier schwer überfahren und bittet um einen Arzt. Gleichzeitig erhielt ich Befehl von der Etappe, morgens nach Rössing zu fahren. Auf dem Bahnhof sollte sich bei mir ein Unteroffizier mit zwei Mann melden. Ich und mein Bursche, beladen mit Proviant, machen uns denn auch früh auf den Bahnhof. Im letzten Augenblick erscheinen glücklich die kommandierten Leute; aber ohne irgend welche Lebensmittel. Zeit war nicht mehr, für sie etwas zu besorgen; so mußten wir auf gut Glück los, was für afrikanische Verhältnisse, wo man auf kein Gasthaus am Wege rechnen kann, immerhin ein etwas ungemütliches Gefühl ist. Allmählich hört der öde Sand auf. Dafür rechts und links groteske Felsen mit Dornenbüschen bewachsen. Dazwischen stehen einzelne Grasbüschel und zu vielen Hunderten aus dem Gestein hervorwachsend an langen Blätterranken Wassermelonen. Mein Bursche sprang während der Fahrt vom Wagen und holte einige Früchte herauf. Wir glaubten, uns eine köstliche Erfrischung erobert zu haben, aber das Zeug schmeckt bitterer als das bitterste Chinin.\n\nInzwischen waren wir in Rössing angekommen. Der ganze Platz besteht aus dem […]&quot;} erste Chinin.\n\nInzwischen waren wir in Rössing angekommen. Der ganze Platz besteht aus dem […]&quot;},{&quot;name&quot;:&quot;Rössing&quot;,&quot;date&quot;:&quot;24.07.1904&quot;,&quot;coord&quot;:[14.86667,-22.51667],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Rückkehr mit dem Verletzten um 10 Uhr. Anforderung eines Extrazuges.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3353425&quot;,&quot;line&quot;:341,&quot;quote&quot;:&quot;[Swakopmund, 24. Juli 1904.]\n\nHeute Mittag, verstaubt und verbrannt von der Sonne, von einer 3tägigen Expedition zurückgekommen. In der Nacht vom 21./22., als ich mich eben schlafen gelegt hatte, bekam ich ein Telegramm vom Hauptmann E.; er hat auf der Fahrt von Rössing nach Arisakos, 40 Kilometer von der Bahnstation, mit seinem Automobilzug, den er auf Befehl des Hauptquartiers mit unendlichen Schwierigkeiten nach Okahandja hinaufbringt, seinen Pionierunteroffizier schwer überfahren und bittet um einen Arzt. Gleichzeitig erhielt ich Befehl von der Etappe, morgens nach Rössing zu fahren. Auf dem Bahnhof sollte sich bei mir ein Unteroffizier mit zwei Mann melden. Ich und mein Bursche, beladen mit Proviant, machen uns denn auch früh auf den Bahnhof. Im letzten Augenblick erscheinen glücklich die kommandierten Leute; aber ohne irgend welche Lebensmittel. Zeit war nicht mehr, für sie etwas zu besorgen; so mußten wir auf gut Glück los, was für afrikanische Verhältnisse, wo man auf kein Gasthaus am Wege rechnen kann, immerhin ein etwas ungemütliches Gefühl ist. Allmählich hört der öde Sand auf. Dafür rechts und links groteske Felsen mit Dornenbüschen bewachsen. Dazwischen stehen einzelne Grasbüschel und zu vielen Hunderten aus dem Gestein hervorwachsend an langen Blätterranken Wassermelonen. Mein Bursche sprang während der Fahrt vom Wagen und holte einige Früchte herauf. Wir glaubten, uns eine köstliche Erfrischung erobert zu haben, aber das Zeug schmeckt bitterer als das bitterste Chinin.\n\nInzwischen waren wir in Rössing angekommen. Der ganze Platz besteht aus dem […]&quot;},{&quot;name&quot;:&quot;Swakopmund&quot;,&quot;date&quot;:&quot;24.07.1904&quot;,&quot;coord&quot;:[14.52663,-22.67842],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Rückkehr am Mittag nach der dreitägigen Rettungsfahrt.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3352844&quot;,&quot;line&quot;:341,&quot;quote&quot;:&quot;[Swakopmund, 24. Juli 1904.]\n\nHeute Mittag, verstaubt und verbrannt von der Sonne, von einer 3tägigen Expedition zurückgekommen. In der Nacht vom 21./22., als ich mich eben schlafen gelegt hatte, bekam ich ein Telegramm vom Hauptmann E.; er hat auf der Fahrt von Rössing nach Arisakos, 40 Kilometer von der Bahnstation, mit seinem Automobilzug, den er auf Befehl des Hauptquartiers mit unendlichen Schwierigkeiten nach Okahandja hinaufbringt, seinen Pionierunteroffizier schwer überfahren und bittet um einen Arzt. Gleichzeitig erhielt ich Befehl von der Etappe, morgens nach Rössing zu fahren. Auf dem Bahnhof sollte sich bei mir ein Unteroffizier mit zwei Mann melden. Ich und mein Bursche, beladen mit Proviant, machen uns denn auch früh auf den Bahnhof. Im letzten Augenblick erscheinen glücklich die kommandierten Leute; aber ohne irgend welche Lebensmittel. Zeit war nicht mehr, für sie etwas zu besorgen; so mußten wir auf gut Glück los, was für afrikanische Verhältnisse, wo man auf kein Gasthaus am Wege rechnen kann, immerhin ein etwas ungemütliches Gefühl ist. Allmählich hört der öde Sand auf. Dafür rechts und links groteske Felsen mit Dornenbüschen bewachsen. Dazwischen stehen einzelne Grasbüschel und zu vielen Hunderten aus dem Gestein hervorwachsend an langen Blätterranken Wassermelonen. Mein Bursche sprang während der Fahrt vom Wagen und holte einige Früchte herauf. Wir glaubten, uns eine köstliche Erfrischung erobert zu haben, aber das Zeug schmeckt bitterer als das bitterste Chinin.\n\nInzwischen waren wir in Rössing angekommen. Der ganze Platz besteht aus dem […]&quot;},{&quot;name&quot;:&quot;Unfallstelle Khan–Wellwitsch&quot;,&quot;date&quot;:&quot;10.08.1904&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Nächtliche Fahrt zu einem Eisenbahnzusammenstoß und Rücktransport der Verletzten.&quot;,&quot;note&quot;:&quot;Unfallpunkt zwischen den genannten Stationen unbestimmt.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:381,&quot;quote&quot;:&quot;**[10. August.]**\n\nAbends um 7 Uhr kam ein Telegramm, daß zwischen Khan und Wellwitsch ein schwerer Eisenbahnzusammenstoß stattgefunden hätte und ärztliche Hilfe dringend nötig sei. Ich fuhr sofort mit einer Lokomotive los und kam in zwei Stunden dort an. Der Lokomotivführer war schwer verbrüht, nebenbei den Unterschenkel gebrochen, der Heizer einen Schädelbruch, schwere Verbrühungen und Beinbruch. Die armen Leute wälzten sich und schrieen vor Schmerzen. Ich gab ihnen tüchtig Morphium und legte Notverbände an. Dann wurden sie auf einen Wagen geladen. Um 11 1/2 Uhr kam ich hier wieder an. Der eine war unterwegs schon seinen Wunden erlegen. Den anderen nahmen wir gleich auf den Operationstisch und mußten ihm die ganzen Stirn- und Nasenknochen aus der Wunde nehmen.\n\nUnd ein babylonisches Sprachgewirr herrscht hier, das jeder Beschreibung spottet. Außer Reichsdeutschen aus allen Provinzen liegen im Lazarett Italiener, Holländer, Engländer, Spanier, sogar ein Grieche und ein Montenegriner, Hottentotten, Ovambos, Kaffern, Bastards usw. usw.\n\nMorgen fahre ich nach Jakalswater um einen Typhuspontok auszuräuchern, aus dem wir letzter Zeit dauernd neue Krankheitsfälle bekommen haben.&quot;},{&quot;name&quot;:&quot;Swakopmund&quot;,&quot;date&quot;:&quot;10.08.1904, nachts&quot;,&quot;coord&quot;:[14.52663,-22.67842],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Gegen 23.30 Uhr von der Unfallstelle zurück.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3352844&quot;,&quot;line&quot;:381,&quot;quote&quot;:&quot;**[10. August.]**\n\nAbends um 7 Uhr kam ein Telegramm, daß zwischen Khan und Wellwitsch ein schwerer Eisenbahnzusammenstoß stattgefunden hätte und ärztliche Hilfe dringend nötig sei. Ich fuhr sofort mit einer Lokomotive los und kam in zwei Stunden dort an. Der Lokomotivführer war schwer verbrüht, nebenbei den Unterschenkel gebrochen, der Heizer einen Schädelbruch, schwere Verbrühungen und Beinbruch. Die armen Leute wälzten sich und schrieen vor Schmerzen. Ich gab ihnen tüchtig Morphium und legte Notverbände an. Dann wurden sie auf einen Wagen geladen. Um 11 1/2 Uhr kam ich hier wieder an. Der eine war unterwegs schon seinen Wunden erlegen. Den anderen nahmen wir gleich auf den Operationstisch und mußten ihm die ganzen Stirn- und Nasenknochen aus der Wunde nehmen.\n\nUnd ein babylonisches Sprachgewirr herrscht hier, das jeder Beschreibung spottet. Außer Reichsdeutschen aus allen Provinzen liegen im Lazarett Italiener, Holländer, Engländer, Spanier, sogar ein Grieche und ein Montenegriner, Hottentotten, Ovambos, Kaffern, Bastards usw. usw.\n\nMorgen fahre ich nach Jakalswater um einen Typhuspontok auszuräuchern, aus dem wir letzter Zeit dauernd neue Krankheitsfälle bekommen haben.&quot;},{&quot;name&quot;:&quot;Khan, historische Station&quot;,&quot;date&quot;:&quot;11.08.1904&quot;,&quot;coord&quot;:[15,-22.55],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Einstündige Mittagspause auf der Fahrt nach Jakalswater.&quot;,&quot;note&quot;:&quot;DWD führt die historische Station Khan bei 22°33′ S, 15°00′ E. Stationsbezug, keine exakte Gebäudekoordinate.&quot;,&quot;source&quot;:&quot;https://www.dwd.de/EN/ourservices/overseas_stations/overseas_documentation/list_overseas_pdf.pdf?__blob=publicationFile&amp;v=9&quot;,&quot;line&quot;:389,&quot;quote&quot;:&quot;**[14. August.]**\n\nVorgestern bin ich von der Fahrt nach Jakalswater zurückgekommen. Es war doch ganz gut, daß ich hinaufgefahren bin. Ich fand oben noch 2 typhuskranke Soldaten aus der Besatzung, die ich dann gleich mit nach hier nahm. Die Fahrt nach Jakalswater dauerte von morgens 6,30 bis abends 6 Uhr mit einstündiger Pause in Khan mittags. Ich legte die Tour hin auf einem Benzinbehälter zurück. Zwar bin ich nicht in die Luft geflogen, aber einen ganz roten Hosenboden habe ich mir dabei geholt. Die Station Khan und das Khangebirge ist wunderschön landschaftlich. Durch tiefe, gigantisch emporragende braune Felsen schneidet das Tal scharf ein. Hier hat das Wasser des Khanflusses, der seine Fluten alle Jahre einmal zum Swakop hinabwälzt, ein tiefes Bett gerissen und so den einzigen Weg durch diese Felsenmassen gebahnt. Jetzt liegt das Bett trocken und sandig da und die Eisenbahnschienen schlängeln sich in ihm hindurch. Aber im Dezember kommen plötzlich mannshohe Fluten angeschossen und reißen alles mit sich, was Menschenhand angelegt hat, und machen die Strecke auf Wochen unpassierbar. Aber schön und romantisch sind die Felsenmassen, wenn auch kein Baum oder Strauch die kahlen Steine beschattet und obwohl eine sengende Glut dauernd in den tiefen Talkesseln sich fängt. Die Felsen sind belebt von Klipp- und Springböcken, von denen man zahlreiche Stücke in Herden über das Gestein springen sieht.\n\nJakalswater ist natürlich auch, wie all die anderen Bahnstationen, nur ein Stationsgebäude mit einigen Eingeborenen-Pontoks und ein paar jetzt in Kriegszeiten errichteten großen […]&quot;},{&quot;name&quot;:&quot;Jakalswater, historische Station&quot;,&quot;date&quot;:&quot;11.–12.08.1904&quot;,&quot;coord&quot;:[15.433333,-22.683333],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Inspektion eines Typhusquartiers; zwei erkrankte Soldaten werden mitgenommen.&quot;,&quot;note&quot;:&quot;DWD: historische Wetterstation 22°41′ S, 15°26′ E. Gleichnamige heutige Farmen liegen abweichend.&quot;,&quot;source&quot;:&quot;https://www.dwd.de/EN/ourservices/overseas_stations/overseas_documentation/list_overseas_pdf.pdf?__blob=publicationFile&amp;v=9&quot;,&quot;line&quot;:389,&quot;quote&quot;:&quot;**[14. August.]**\n\nVorgestern bin ich von der Fahrt nach Jakalswater zurückgekommen. Es war doch ganz gut, daß ich hinaufgefahren bin. Ich fand oben noch 2 typhuskranke Soldaten aus der Besatzung, die ich dann gleich mit nach hier nahm. Die Fahrt nach Jakalswater dauerte von morgens 6,30 bis abends 6 Uhr mit einstündiger Pause in Khan mittags. Ich legte die Tour hin auf einem Benzinbehälter zurück. Zwar bin ich nicht in die Luft geflogen, aber einen ganz roten Hosenboden habe ich mir dabei geholt. Die Station Khan und das Khangebirge ist wunderschön landschaftlich. Durch tiefe, gigantisch emporragende braune Felsen schneidet das Tal scharf ein. Hier hat das Wasser des Khanflusses, der seine Fluten alle Jahre einmal zum Swakop hinabwälzt, ein tiefes Bett gerissen und so den einzigen Weg durch diese Felsenmassen gebahnt. Jetzt liegt das Bett trocken und sandig da und die Eisenbahnschienen schlängeln sich in ihm hindurch. Aber im Dezember kommen plötzlich mannshohe Fluten angeschossen und reißen alles mit sich, was Menschenhand angelegt hat, und machen die Strecke auf Wochen unpassierbar. Aber schön und romantisch sind die Felsenmassen, wenn auch kein Baum oder Strauch die kahlen Steine beschattet und obwohl eine sengende Glut dauernd in den tiefen Talkesseln sich fängt. Die Felsen sind belebt von Klipp- und Springböcken, von denen man zahlreiche Stücke in Herden über das Gestein springen sieht.\n\nJakalswater ist natürlich auch, wie all die anderen Bahnstationen, nur ein Stationsgebäude mit einigen Eingeborenen-Pontoks und ein paar jetzt in Kriegszeiten errichteten großen […]&quot;},{&quot;name&quot;:&quot;Swakopmund&quot;,&quot;date&quot;:&quot;12.08.–Ende 09.1904&quot;,&quot;coord&quot;:[14.52663,-22.67842],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Rückkehr am 12. August. Am 25. September Versetzungsbefehl nach Karibib.&quot;,&quot;note&quot;:&quot;Tatsächlicher Abreisetag nicht genannt.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3352844&quot;,&quot;line&quot;:389,&quot;quote&quot;:&quot;**[14. August.]**\n\nVorgestern bin ich von der Fahrt nach Jakalswater zurückgekommen. Es war doch ganz gut, daß ich hinaufgefahren bin. Ich fand oben noch 2 typhuskranke Soldaten aus der Besatzung, die ich dann gleich mit nach hier nahm. Die Fahrt nach Jakalswater dauerte von morgens 6,30 bis abends 6 Uhr mit einstündiger Pause in Khan mittags. Ich legte die Tour hin auf einem Benzinbehälter zurück. Zwar bin ich nicht in die Luft geflogen, aber einen ganz roten Hosenboden habe ich mir dabei geholt. Die Station Khan und das Khangebirge ist wunderschön landschaftlich. Durch tiefe, gigantisch emporragende braune Felsen schneidet das Tal scharf ein. Hier hat das Wasser des Khanflusses, der seine Fluten alle Jahre einmal zum Swakop hinabwälzt, ein tiefes Bett gerissen und so den einzigen Weg durch diese Felsenmassen gebahnt. Jetzt liegt das Bett trocken und sandig da und die Eisenbahnschienen schlängeln sich in ihm hindurch. Aber im Dezember kommen plötzlich mannshohe Fluten angeschossen und reißen alles mit sich, was Menschenhand angelegt hat, und machen die Strecke auf Wochen unpassierbar. Aber schön und romantisch sind die Felsenmassen, wenn auch kein Baum oder Strauch die kahlen Steine beschattet und obwohl eine sengende Glut dauernd in den tiefen Talkesseln sich fängt. Die Felsen sind belebt von Klipp- und Springböcken, von denen man zahlreiche Stücke in Herden über das Gestein springen sieht.\n\nJakalswater ist natürlich auch, wie all die anderen Bahnstationen, nur ein Stationsgebäude mit einigen Eingeborenen-Pontoks und ein paar jetzt in Kriegszeiten errichteten großen […]&quot;},{&quot;name&quot;:&quot;Karibib&quot;,&quot;date&quot;:&quot;spätestens 09.10.1904&quot;,&quot;coord&quot;:[15.85654,-21.93554],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Arbeit am Etappenlazarett. Der Autor ist laut Eintrag bereits seit einiger Zeit hier.&quot;,&quot;note&quot;:&quot;Anreise zwischen dem Befehl vom 25. September und dem Eintrag vom 9. Oktober.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3356332&quot;,&quot;line&quot;:429,&quot;quote&quot;:&quot;[Karibib, 9. Oktober 1904.]\n\nSeit einiger Zeit bin ich hier in R., „der letzten Zuflucht“, wie die Übersetzung des Namens heißt, wohl aus der Zeit, als noch wilde Kämpfe der Hottentotten und der Hereros das Land durchtobten. Nach einem sehr heißen Tage haben Assistenzarzt S. und ich uns auf dem Balkon meiner Wohnbaracke mit einer Flasche seltenen Bieres gelabt. Ein wunderherrlicher Sonnenuntergang! Der rote Feuerball sinkt langsam hinter eine hohe Bergkuppe und beleuchtet mit rotgoldener Glut alle Spitzen des Erongogebirges, den Zufluchtsort wilder Räuberbanden. Am Nachmittag, nachdem wir Hauptmann P., der krank nach Hause geht und hier Nachtstation macht, ein Quartier im Lazarett besorgt hatten, waren wir in der Werft der nicht aufständigen Eingeborenen. Es war gerade Besperzeit und die Bockiherden kamen von allen Seiten, von ihren Hirten getrieben, in die Werft zurück; die Muttertiere lebhaft begrüßt von den zu Hause gebliebenen Lämmern, die ihnen laut blökend entgegenteilten. Überall herrschte reges Leben. In allen Pontoks, die aus Röhricht und Sand kunstvoll in Zuckerhutform sich in großem Kreis um einen in der Mitte freien Platz reihten, brannten lustige Feuer, auf denen die Weiber die Abendkost für die bei den Europäern arbeitenden Männer, deren Heimkehr sie erwarteten, zubereiteten. Ein schönes Bild des Friedens und Wohlstandes, dessen sich die getreuen Kaffern unter deutscher Herrschaft erfreuen.&quot;},{&quot;name&quot;:&quot;Oladjomokuju, Pferdeposten&quot;,&quot;date&quot;:&quot;29.–30.10.1904&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Ausflug per Pferdekarre zum Pferdeposten, Übernachtung und Jagd in den Bergen weiter östlich.&quot;,&quot;note&quot;:&quot;Historischer Name nicht sicher auf einen heutigen Ort abgebildet.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:437,&quot;quote&quot;:&quot;[Karibib, 31. Oktober 1904.]\n\nGestern endlich war ich wieder aus Krankenstubenluft und Schreiberei in die Berge gekommen. Ich habe einen erfolgreichen Jagdzug unternommen. Vorgestern nachmittag holte uns R. mit seiner Pferdekarre auf seinen Pferdeposten Oladjomokuju. Die Fahrt mit der Karre dauerte 2 Stunden durch üppige Grassteppe. D. ist eine schöne Wasserstelle, mitten in den Bergen und zeichnet sich dadurch aus, daß dort ein bekannter „Pferdesterbeplatz“ ist; d. h. Lucus a non lucendo. In der Zeit der Pferdesterbe, in der fast überall die Pferde in Scharen eingehen, sterben dort keine Pferde. Deshalb hatte die Regierung auch dort ein tierärztliches Laboratorium in einem festen Hause eingerichtet. Jetzt stehen nur noch die rauchgeschwärzten Mauern, die ganze schöne, erst 3 Monate alte Einrichtung liegt auf dem Aschenhaufen und der Regierungstierarzt Kempny ist erschlagen. Das ausgebrannte Dach ist jetzt mit Wellblech abgedeckt, die schwarzgeräucherten Wände teilweise mit Decken vernagelt. Unheimlich prangt über der Schlaffstelle des früheren Bewohners in der Form eines Wappenschildes tief in die Kalkwand eingebrannt ein schwarzer Fleck. Hier hat ein Couleurwappenschild des Ermordeten aus Holz gehangen, eine Erinnerung an frohe Studententage, das bei der allgemeinen Zerstörung durch die aufständigen Kaffern wohl mit verbrannte und seine Umrisse dabei scharf in die Kalkwand gezeichnet hatte. Jetzt sieht es um die Farm herum wieder ganz freundlich aus. Weiß angekalkte Pferdekräle aus dicken Baumstämmen sind ringsherum gezimmert, sorgsam jeder einzelne mit großer römischer […]&quot;},{&quot;name&quot;:&quot;Karibib&quot;,&quot;date&quot;:&quot;31.10.–12.12.1904&quot;,&quot;coord&quot;:[15.85654,-21.93554],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Weitere Lazarettzeit; am 12. Dezember Befehl zur 4. Kompanie des II. Feldregiments.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3356332&quot;,&quot;line&quot;:447,&quot;quote&quot;:&quot;[Karibib, 12. Dezember 1904.]\n\nHurra, endlich ins Feld! „Assistenzarzt v. O. vom Feldregiment I. — zurzeit am Lazarett Karibib — wird an Stelle des erkrankten Assistenzarztes R. zur 4. Kompanie des II. Feldregiments kommandiert. Derselbe hat sich nach Eintreffen des Assistenzarztes B. sofort nach Windhuk zu begeben. Die Kompanie befindet sich im Süden. Dem Etappenkommando zur Benachrichtigung des Assistenzarztes B., zur Instandierung des Assistenzarztes v. O., Berittenmachung und wenn erforderlich, Stellung eines Burschen“ so lautete der Befehl. Da meine Kompanie, die zur Abteilung Major Meister gehört, schon unten im Süden in Fühlung mit den Witboys ist, werde ich mich einer Proviantkolonne anschließen. Nun leb&#x27; wohl, Etappe; vorläufig sind wir miteinander fertig!&quot;},{&quot;name&quot;:&quot;Windhuk / Windhoek&quot;,&quot;date&quot;:&quot;19.–20.12.1904&quot;,&quot;coord&quot;:[17.08323,-22.55941],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Vorbereitung des Anschlusses an eine Proviantkolonne. Abmarsch am 20. Dezember nachmittags.&quot;,&quot;note&quot;:&quot;Der Abmarsch wird im Eintrag vom 21. Dezember rückblickend beschrieben.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3352136&quot;,&quot;line&quot;:451,&quot;quote&quot;:&quot;[Windhuk, 19. Dezember 1904.]\n\nDer Abmarsch geht mit ganz ungewöhnlicher, nicht afrikanischer Pünktlichkeit vonstatten. Zufällig sind noch zwei ganz leidliche Pferde auf der Etappe vorhanden und zufällig geht auch schon morgen eine Proviantkolonne nach dem Süden unter Leutnant D. Leider ist mein schwarzer Junge hier in Windhuk typhuskrank geworden; ich wollte ihn mitnehmen, da er ganz anstellig war. Nun muß ich ihn im Eingeborenenlazarett lassen. So rücken wir nur noch zu dreien aus: Bor, der Bulldog, S., mein Bursche, Porzellanmaler von Beruf, aus Thüringen gebürtig; ebenso gutmütig wie dumm, aber eine treue Seele, und ich. Windhuk hat meinen Erwartungen nicht entsprochen. Zwar blühen hier Rosen und Oleander und andere duftende Sträucher, so daß das ganze Tal jetzt zur Zeit der Blüte mit Wohlgerüchen erfüllt ist, aber der allesdurchdringende feine Kaltstaub, der sich in heißer Sonnenglut auf Menschen, Tiere und Pflanzen lagert, stört den Genuß.\n\nMorgen werden wir abrücken.&quot;},{&quot;name&quot;:&quot;Klein-Windhuk&quot;,&quot;date&quot;:&quot;20.12.1904&quot;,&quot;coord&quot;:[17.1,-22.583333],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Durch das Tal von Klein-Windhuk, kurze Rast an der Brauerei, danach Nachtlager.&quot;,&quot;note&quot;:&quot;Historischer Ortsbezug nach DWD 22°35′ S, 17°06′ E; Lager und Brauerei nicht punktgenau.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:457,&quot;quote&quot;:&quot;[Kabs Farm (20 km östl. Windhuk), 21. Dezember.]\n\nZum erstenmal heute auf der Pad!\n\nNach vierstündigem, strammem Morgentreck liegen wir bei einer sehr guten Wasserstelle, der Farm Kabs. Auf der Veranda des verlassenen, nicht allzu sehr zerstörten Farmhauses haben D. und ich eben ein vorzügliches Frühstück eingenommen, bestehend aus von Windhuk noch mitgenommenen Eiern und Cornedbeef. Jetzt liegt er in meiner Hängematte, die ich auf der Veranda habe anhängen lassen und schnarcht, während ich hier schreibe. Der Blick geht auf eine weite, grüne Ebene, auf der unsere Maulesel und Pferde weiden, dahinter die Gipfel des Auasgebirges, einem Schlupfwinkel von allerlei gelbem und rotem Gesindel.\n\nDas „Trecken“ mit Eselkolonne ist ganz pläsierlich, solange sie was zu fressen haben. Morgens von 4—8 Uhr wird ein großer Treck gemacht. Zwei Leute mit langer Bambuspeitsche lenken und dirigieren die Tiere, natürlich geht es immer im Schritt, was auf die Dauer für Reiter und Pferd etwas ermüdend wirkt. Dann ist große Rast. Die Pferde und Esel werden auf die Weide getrieben; Mensch und Tier ißt, frißt und schläft und abends gibt es noch einen Treck von 2 bis 3 Stunden. Um 4 Uhr rückten wir gestern abend ab, durch das wunderschöne Tal von Kl. Windhuk. Da ist Obstgarten an Weingarten und Laub und allerlei Grünes wie in Deutschland. Am Ende des Tales liegt die Brauerei, die natürlich bei so einem deutschen Idyll nicht fehlen darf; da machten wir auch noch eine kurze Rast, um uns bei einem Glaube längst nicht mehr gewohnten Faßbiers zu erquicken. Inzwischen hatte es angefangen zu donnern und zu […]&quot;},{&quot;name&quot;:&quot;Kabs Farm&quot;,&quot;date&quot;:&quot;21.12.1904, morgens&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Nach vierstündigem Morgentreck Rast auf der Farm, laut Überschrift 20 km östlich Windhuk.&quot;,&quot;note&quot;:&quot;Nicht sicher identifiziert; Entfernungsangabe wird nicht als exakte Koordinate ausgegeben.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:457,&quot;quote&quot;:&quot;[Kabs Farm (20 km östl. Windhuk), 21. Dezember.]\n\nZum erstenmal heute auf der Pad!\n\nNach vierstündigem, strammem Morgentreck liegen wir bei einer sehr guten Wasserstelle, der Farm Kabs. Auf der Veranda des verlassenen, nicht allzu sehr zerstörten Farmhauses haben D. und ich eben ein vorzügliches Frühstück eingenommen, bestehend aus von Windhuk noch mitgenommenen Eiern und Cornedbeef. Jetzt liegt er in meiner Hängematte, die ich auf der Veranda habe anhängen lassen und schnarcht, während ich hier schreibe. Der Blick geht auf eine weite, grüne Ebene, auf der unsere Maulesel und Pferde weiden, dahinter die Gipfel des Auasgebirges, einem Schlupfwinkel von allerlei gelbem und rotem Gesindel.\n\nDas „Trecken“ mit Eselkolonne ist ganz pläsierlich, solange sie was zu fressen haben. Morgens von 4—8 Uhr wird ein großer Treck gemacht. Zwei Leute mit langer Bambuspeitsche lenken und dirigieren die Tiere, natürlich geht es immer im Schritt, was auf die Dauer für Reiter und Pferd etwas ermüdend wirkt. Dann ist große Rast. Die Pferde und Esel werden auf die Weide getrieben; Mensch und Tier ißt, frißt und schläft und abends gibt es noch einen Treck von 2 bis 3 Stunden. Um 4 Uhr rückten wir gestern abend ab, durch das wunderschöne Tal von Kl. Windhuk. Da ist Obstgarten an Weingarten und Laub und allerlei Grünes wie in Deutschland. Am Ende des Tales liegt die Brauerei, die natürlich bei so einem deutschen Idyll nicht fehlen darf; da machten wir auch noch eine kurze Rast, um uns bei einem Glaube längst nicht mehr gewohnten Faßbiers zu erquicken. Inzwischen hatte es angefangen zu donnern und zu […]&quot;},{&quot;name&quot;:&quot;Vogtsfarm&quot;,&quot;date&quot;:&quot;21.12.1904, abends&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Nacht auf der zerstörten Farm mit künstlichem Wasserbecken und ehemaliger Straußenzucht.&quot;,&quot;note&quot;:&quot;Keine gesicherte Gleichsetzung mit einer heutigen Farm.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:465,&quot;quote&quot;:&quot;[Hohewarte (50 km südöstl. Windhuk), 22. Dezember.]\n\nD. traf noch in Kabs Farm zu uns. Kurz vor unserem Abritt stieß noch Leutnant v. S. mit Burschen und Eingeborenen zu uns, der Kommandant des in der Nähe befindlichen Pferdedepots Abrahamsfarm ist, und uns eine Tagereise begleiten will. Da ich ihn im Lazarett Swakopmund an einem ziemlich schweren Darmkatarrh behandelt habe, tauschte er mir gegen meine beiden nicht sehr berühmten Klepper ein paar kräftige, gut im Futter stehende Orlogspferde ein, so daß ich jetzt sehr gut beritten bin. Abends treckten wir bis Vogtsfarm. Ein sehr schönes, großes Wasserbecken, von dem Besitzer durch mühevoll gerichtete Staudämme künstlich gebaut. Die Farm ist zerstört, d. h. Türen und Fenster zerschlagen, alles Inventar geplündert. Es bestand früher auf der Farm eine große Straußenzucht. Die Hereros haben aber sämtlichen Tieren die Hälse abgeschnitten. Große Haufen von Federn von vielen 100 Mark Wert liegen jetzt zerfressen von Motten in den Stuben. 2 Korbstühle waren der allgemeinen Zerstörung entgangen, die uns einen willkommenen Sitz bei unserem Abendmahl abgaben, das aus gebratenem „Kurrhahn“, den ich nachmittags schoß, und eingemachten Früchten bestand. Auch zwei etwas defekte Betten mit Sprungfedermatratzen waren noch vorhanden. Eins davon nahm ich in Beschlag und ließ meinen Schlafsack darauf legen. So hatte ich eine prächtige Lagerstatt für die Nacht.\n\nAbends traf uns noch ein Reiter von der Besatzung der Polizeistation Hohewarte, auf der wir heute sind, mit der Bitte um Verstärkung von Windhuk dringend, da 2 Stunden südwestlich […]&quot;},{&quot;name&quot;:&quot;Hohewarte&quot;,&quot;date&quot;:&quot;22.12.1904&quot;,&quot;coord&quot;:[17.40455,-22.64357],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Ankunft an der Polizeistation; Aufbruch zu einem Entsatzritt nach Dornbaum.&quot;,&quot;note&quot;:&quot;Zuordnung zur heutigen Farm Hohewarte; damalige Station nicht punktgenau.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3356745&quot;,&quot;line&quot;:465,&quot;quote&quot;:&quot;[Hohewarte (50 km südöstl. Windhuk), 22. Dezember.]\n\nD. traf noch in Kabs Farm zu uns. Kurz vor unserem Abritt stieß noch Leutnant v. S. mit Burschen und Eingeborenen zu uns, der Kommandant des in der Nähe befindlichen Pferdedepots Abrahamsfarm ist, und uns eine Tagereise begleiten will. Da ich ihn im Lazarett Swakopmund an einem ziemlich schweren Darmkatarrh behandelt habe, tauschte er mir gegen meine beiden nicht sehr berühmten Klepper ein paar kräftige, gut im Futter stehende Orlogspferde ein, so daß ich jetzt sehr gut beritten bin. Abends treckten wir bis Vogtsfarm. Ein sehr schönes, großes Wasserbecken, von dem Besitzer durch mühevoll gerichtete Staudämme künstlich gebaut. Die Farm ist zerstört, d. h. Türen und Fenster zerschlagen, alles Inventar geplündert. Es bestand früher auf der Farm eine große Straußenzucht. Die Hereros haben aber sämtlichen Tieren die Hälse abgeschnitten. Große Haufen von Federn von vielen 100 Mark Wert liegen jetzt zerfressen von Motten in den Stuben. 2 Korbstühle waren der allgemeinen Zerstörung entgangen, die uns einen willkommenen Sitz bei unserem Abendmahl abgaben, das aus gebratenem „Kurrhahn“, den ich nachmittags schoß, und eingemachten Früchten bestand. Auch zwei etwas defekte Betten mit Sprungfedermatratzen waren noch vorhanden. Eins davon nahm ich in Beschlag und ließ meinen Schlafsack darauf legen. So hatte ich eine prächtige Lagerstatt für die Nacht.\n\nAbends traf uns noch ein Reiter von der Besatzung der Polizeistation Hohewarte, auf der wir heute sind, mit der Bitte um Verstärkung von Windhuk dringend, da 2 Stunden südwestlich […]&quot;},{&quot;name&quot;:&quot;Dornbaum, Schaffluss-Tal&quot;,&quot;date&quot;:&quot;22.12.1904, nachmittags&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Zweistündiger Ritt zur Burenfarm. Die Angegriffenen werden erreicht; keine Verfolgung.&quot;,&quot;note&quot;:&quot;Lage nur relativ zu Hohewarte beschrieben.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:477,&quot;quote&quot;:&quot;[Schaf-Revier (70 km südöstl. Windhuk), 23. Dezember.]\n\nUnsere Expedition ist ziemlich unblutig verlaufen. Nach 2 Stunden ziemlich scharfen Reitens fanden wir im Tal des Schafflusses die Burenfarm. Leider hatten sich die schwarzen Teufel rechtzeitig aus dem Staube gemacht, unter Mitnahme sämtlichen Viehs. Eine Verfolgung in die Berge war mangels Zeit nicht möglich. So konnten wir nur die Gastfreundschaft der Buren, die aus einer Familie von 8 Männern und 6 Frauen mit vielen Kindern bestanden, für kurze Zeit in Anspruch nehmen und mußten dann unverrichteter Sache wieder nach Hohewarte zurückkehren, wo wir todmüde um 9 Uhr abends eintrafen. Inzwischen hatte das Gesindel die ganze Grasebene angesteckt, so daß rings um uns ein großes Feuer war.\n\nDa wir heute einen sehr langen Treck haben, ging&#x27;s schon um 3 Uhr wieder los. Morgens hatten wir die Freude, daß uns zwei dickgefressene Maultiere, wahrscheinlich irgendwo der Truppe entlaufen, zuliefen. Ein willkommener Ersatz für etwa schlappwerdende Zugtiere. Auf dem Marsch schoß ich ein Perlhuhn, drei Tauben, eine Trappe, einen „Steenbock“, so daß wieder reichlich für Kost gesorgt ist. Die beiden Hühner wurden leider von unserem „Koch“ so hart gebraten, daß man einem damit Löcher in den Kopf werfen konnte. Unsere Mittagspause haben wir in dem landschaftlich sehr schönen, von großen, kühlenden Schatten spendenden Anabäumen umsäumten aber leider ganz wasserlosen Revier des Schafflusses aufgeschlagen. Nach Graben eines 2 m tiefen Loches in dem Sand des Flußbettes fanden wir reichlich fließendes Wasser, so daß auch die Tiere, wenn auch […]&quot;},{&quot;name&quot;:&quot;Hohewarte&quot;,&quot;date&quot;:&quot;22.12.1904, 21 Uhr&quot;,&quot;coord&quot;:[17.40455,-22.64357],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Rückkehr von Dornbaum; am nächsten Morgen um 3 Uhr weiter.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3356745&quot;,&quot;line&quot;:477,&quot;quote&quot;:&quot;[Schaf-Revier (70 km südöstl. Windhuk), 23. Dezember.]\n\nUnsere Expedition ist ziemlich unblutig verlaufen. Nach 2 Stunden ziemlich scharfen Reitens fanden wir im Tal des Schafflusses die Burenfarm. Leider hatten sich die schwarzen Teufel rechtzeitig aus dem Staube gemacht, unter Mitnahme sämtlichen Viehs. Eine Verfolgung in die Berge war mangels Zeit nicht möglich. So konnten wir nur die Gastfreundschaft der Buren, die aus einer Familie von 8 Männern und 6 Frauen mit vielen Kindern bestanden, für kurze Zeit in Anspruch nehmen und mußten dann unverrichteter Sache wieder nach Hohewarte zurückkehren, wo wir todmüde um 9 Uhr abends eintrafen. Inzwischen hatte das Gesindel die ganze Grasebene angesteckt, so daß rings um uns ein großes Feuer war.\n\nDa wir heute einen sehr langen Treck haben, ging&#x27;s schon um 3 Uhr wieder los. Morgens hatten wir die Freude, daß uns zwei dickgefressene Maultiere, wahrscheinlich irgendwo der Truppe entlaufen, zuliefen. Ein willkommener Ersatz für etwa schlappwerdende Zugtiere. Auf dem Marsch schoß ich ein Perlhuhn, drei Tauben, eine Trappe, einen „Steenbock“, so daß wieder reichlich für Kost gesorgt ist. Die beiden Hühner wurden leider von unserem „Koch“ so hart gebraten, daß man einem damit Löcher in den Kopf werfen konnte. Unsere Mittagspause haben wir in dem landschaftlich sehr schönen, von großen, kühlenden Schatten spendenden Anabäumen umsäumten aber leider ganz wasserlosen Revier des Schafflusses aufgeschlagen. Nach Graben eines 2 m tiefen Loches in dem Sand des Flußbettes fanden wir reichlich fließendes Wasser, so daß auch die Tiere, wenn auch […]&quot;},{&quot;name&quot;:&quot;Schaf-Revier&quot;,&quot;date&quot;:&quot;23.12.1904&quot;,&quot;coord&quot;:null,&quot;kind&quot;:&quot;Offen&quot;,&quot;summary&quot;:&quot;Mittagsrast im trockenen Flussbett; Wasser wird in zwei Metern Tiefe gefunden. Danach weiteres Nachtlager.&quot;,&quot;note&quot;:&quot;Rastplatz nicht bestimmt. Die gleichnamige DWD-Station liegt nicht sicher an diesem Marschabschnitt.&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:477,&quot;quote&quot;:&quot;[Schaf-Revier (70 km südöstl. Windhuk), 23. Dezember.]\n\nUnsere Expedition ist ziemlich unblutig verlaufen. Nach 2 Stunden ziemlich scharfen Reitens fanden wir im Tal des Schafflusses die Burenfarm. Leider hatten sich die schwarzen Teufel rechtzeitig aus dem Staube gemacht, unter Mitnahme sämtlichen Viehs. Eine Verfolgung in die Berge war mangels Zeit nicht möglich. So konnten wir nur die Gastfreundschaft der Buren, die aus einer Familie von 8 Männern und 6 Frauen mit vielen Kindern bestanden, für kurze Zeit in Anspruch nehmen und mußten dann unverrichteter Sache wieder nach Hohewarte zurückkehren, wo wir todmüde um 9 Uhr abends eintrafen. Inzwischen hatte das Gesindel die ganze Grasebene angesteckt, so daß rings um uns ein großes Feuer war.\n\nDa wir heute einen sehr langen Treck haben, ging&#x27;s schon um 3 Uhr wieder los. Morgens hatten wir die Freude, daß uns zwei dickgefressene Maultiere, wahrscheinlich irgendwo der Truppe entlaufen, zuliefen. Ein willkommener Ersatz für etwa schlappwerdende Zugtiere. Auf dem Marsch schoß ich ein Perlhuhn, drei Tauben, eine Trappe, einen „Steenbock“, so daß wieder reichlich für Kost gesorgt ist. Die beiden Hühner wurden leider von unserem „Koch“ so hart gebraten, daß man einem damit Löcher in den Kopf werfen konnte. Unsere Mittagspause haben wir in dem landschaftlich sehr schönen, von großen, kühlenden Schatten spendenden Anabäumen umsäumten aber leider ganz wasserlosen Revier des Schafflusses aufgeschlagen. Nach Graben eines 2 m tiefen Loches in dem Sand des Flußbettes fanden wir reichlich fließendes Wasser, so daß auch die Tiere, wenn auch […]&quot;},{&quot;name&quot;:&quot;Hatsamas&quot;,&quot;date&quot;:&quot;24.12.1904&quot;,&quot;coord&quot;:[17.62313,-22.91417],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Ankunft am Morgen und Weihnachtsabend im verlassenen Storehaus.&quot;,&quot;note&quot;:&quot;Ortsbezug nach GeoNames; das damalige Storehaus ist nicht lokalisiert.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3356879&quot;,&quot;line&quot;:483,&quot;quote&quot;:&quot;[Hatsamas (85 km südöstl. Windhuk), 24. Dezember.]\n\nGestern abend noch 6 km weiter gezogen, dann ohne Wasser ein Lager aufgeschlagen. Wiedermal unter freiem Himmel genächtigt. Heute morgen mußten wir sehr früh aufbrechen, da uns der Grasbrand ziemlich dicht auf den Hals rückte. Heute früh ein sehr langer Treck bis Hatsamas. Hier haben wir Besitz von einem verlassenen Storehaus ergriffen, früher einem ehemaligen Sanitätsunteroffizier A. gehörig, der sich durch Handel und Frachtfahren zu einem sehr vermögenden Mann heraufgearbeitet hat. In seinem Haus sieht es wüst aus. Der ganze Store ist der Plünderung anheimgefallen. Die Hereros müssen aber wohl beim Plündern gestört worden sein, denn alles liegt in wüstem Durcheinander; Kleider, Hüte, Speisen, Wein, Geschirr usw. Hatsamas liegt am Mosob, einem natürlich auch wasserlosen Revier, aber hier ist ein sehr ergiebiger Brunnen, der für die Tiere reichlich Wasser geben kann. Da wir morgen zum 1. Weihnachtstage 50 bis 60 km Durststrecke haben, so werden wir heute hier bleiben und den heiligen Abend hier feiern. Eingeleitet und in Feststimmung gebracht haben wir uns durch einen schönen Festbraten heute mittag „Rehziemer“, von mir selber gespickt, Konservenbohnen, Mehlspeise mit Preißelbeeren, nachmittags Kakao mit selbstgehackenen Berliner Pfannkuchen, gefüllt mit feinem Fruchtmus. Ich sitze hier auf einem erbeuteten Kaffernstuhl vor dem Hause und schreibe auf einer leeren Bierkiste. Vor mir auf dem freien Platze ist in einem leeren Wasserfaß unser Weihnachtsbaum geschmückt. Die Leute haben ihn sehr sinnvoll unten mit leeren […]&quot;},{&quot;name&quot;:&quot;Autabib&quot;,&quot;date&quot;:&quot;25.12.1904&quot;,&quot;coord&quot;:[17.67716,-23.0178],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Rast am Schafrevier, danach angekündigte Durststrecke über das Karibiamsgebirge.&quot;,&quot;note&quot;:&quot;Für die Tage danach fehlen im übergebenen Text Einträge.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3358509&quot;,&quot;line&quot;:489,&quot;quote&quot;:&quot;[Autabib, 25. Dezember 1904.]\n\nHeute sind wir gerade 100 km von Windhuk. Der erste Weihnachtstag wird ein beschwerlicher für Menschen und Pferde. Heute Morgen sind wir schon 20 km gezogen und haben hier am Schafrevier nur soviel Wasser in einem tiefen Wasserloch gefunden, daß wir für jedes Tier gerade einen Eimer hatten. Heute müssen wir noch durch 50 km bis zur nächsten Wasserstelle, und dazu noch über das Karibiamsgebirge. Unser Heiligabend ist recht nett verlaufen. Als wir gerade beim Singen des Weihnachtsliedes um unseren improvisierten Christbaum versammelt waren, kam noch zu unserer Gesellschaft Leutnant St. mit einem Veterinär und einem Vertreter der Handelsfirma V., halb verhungert und verdurftet, ihrer Leerkolonne vorangeritten, die durch dieselbe Strecke zurückkamen, die wir jetzt ziehen, und etwas später traf von Windhuk Oberleutnant von R. ein, der auch seiner Kolonne, die uns auf einem Tagemarsch folgt, vorausgeritten war. Eine so erlauchte Gesellschaft hat Hatsamas wohl noch nicht gesehen. Es war eine Freude zu sehen, wie die verhungerte Gesellschaft sich über unser Weihnachtsmahl machte und wir waren in fidelster Stimmung bis spät in die Nacht hinein zusammen.&quot;},{&quot;name&quot;:&quot;Swartmodder&quot;,&quot;date&quot;:&quot;02.01.1905, morgens&quot;,&quot;coord&quot;:[18.19422,-24.22943],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Nach einer Verirrung erkennt der Autor die zerstörte Farm des Buren Smith.&quot;,&quot;note&quot;:&quot;Plausible Zuordnung zur Farm nordwestlich Stampriet; Identität nicht unabhängig historisch bestätigt.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3352809&quot;,&quot;line&quot;:493,&quot;quote&quot;:&quot;[Kalkfontein, 4. Januar 1905.]\n\nIch war mit meinen Aufzeichnungen stehen geblieben am 1. Januar mittags, in der Hoffnung, abends in Kalkfontein zu sein; aber „erstens kommt es anders, zweitens sind wir in Afrika“, wie man hier sagt. Wir fuhren nämlich „zum falschen Tor hinaus“, und abends, als wir nicht mehr wußten, wo wir waren, legten wir uns auf die Pad. Morgens früh, 2. Januar, befanden wir uns in der Nähe einer ziemlich großen, zerstörten Farm. Ich ritt hinüber und stellte aus den wüst herumliegenden Schriften und Büchern fest, daß sie dem Boer Smith gehört hatte und wir uns auf Swartmodder befanden; alles war wüst durcheinander geworfen und verbrannt. In der ehemaligen Schlaffstube waren der erschlagene Mann und seine Angehörigen von der deutschen Truppe beerdigt. Vor dem Hause war ein großer Teich. Ich schoß auf demselben ein Paar Enten und erbeutete sechs fettgefressene Esel, die wohl früher dem Farmer gehört hatten. Nachdem wir uns orientiert hatten, setzten wir unseren Marsch auf Kalkfontein fort. Unterwegs stundenlanges Geschützfeuer. Abteilung Meister war darnach mit den Witboys wieder handgemein. Gegen Mittag erreichten wir die große flache Kalkpfanne von R. Die Abteilung war vor zwei Tagen abgerückt und hatte zwei schwere Gefechte mit den Hottentotten gehabt. Die Verwundeten aus dem ersten Gefecht aus Stamprietfontein, darunter drei Offiziere, waren schon eingetroffen, so daß ich gleich zu tun bekam. Für mich war der schriftliche Befehl hier, vorläufig auf diesem Platz, der als Proviantlagerplatz und Krankensammelstelle vorgesehen ist, zu bleiben, und weitere […]&quot;},{&quot;name&quot;:&quot;Kalkfontein-Nord&quot;,&quot;date&quot;:&quot;02.–05.01.1905&quot;,&quot;coord&quot;:[18.316667,-24.333333],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Am 2. Januar mittags am Proviantlager und an der Krankensammelstelle angekommen.&quot;,&quot;note&quot;:&quot;Historischer Stationsbezug: DWD 24°20′ S, 18°19′ E. Nicht Kalkfontein-Süd / Karasburg.&quot;,&quot;source&quot;:&quot;https://www.dwd.de/EN/ourservices/overseas_stations/overseas_documentation/list_overseas_20200623_pdf.pdf?__blob=publicationFile&amp;v=3&quot;,&quot;line&quot;:493,&quot;quote&quot;:&quot;[Kalkfontein, 4. Januar 1905.]\n\nIch war mit meinen Aufzeichnungen stehen geblieben am 1. Januar mittags, in der Hoffnung, abends in Kalkfontein zu sein; aber „erstens kommt es anders, zweitens sind wir in Afrika“, wie man hier sagt. Wir fuhren nämlich „zum falschen Tor hinaus“, und abends, als wir nicht mehr wußten, wo wir waren, legten wir uns auf die Pad. Morgens früh, 2. Januar, befanden wir uns in der Nähe einer ziemlich großen, zerstörten Farm. Ich ritt hinüber und stellte aus den wüst herumliegenden Schriften und Büchern fest, daß sie dem Boer Smith gehört hatte und wir uns auf Swartmodder befanden; alles war wüst durcheinander geworfen und verbrannt. In der ehemaligen Schlaffstube waren der erschlagene Mann und seine Angehörigen von der deutschen Truppe beerdigt. Vor dem Hause war ein großer Teich. Ich schoß auf demselben ein Paar Enten und erbeutete sechs fettgefressene Esel, die wohl früher dem Farmer gehört hatten. Nachdem wir uns orientiert hatten, setzten wir unseren Marsch auf Kalkfontein fort. Unterwegs stundenlanges Geschützfeuer. Abteilung Meister war darnach mit den Witboys wieder handgemein. Gegen Mittag erreichten wir die große flache Kalkpfanne von R. Die Abteilung war vor zwei Tagen abgerückt und hatte zwei schwere Gefechte mit den Hottentotten gehabt. Die Verwundeten aus dem ersten Gefecht aus Stamprietfontein, darunter drei Offiziere, waren schon eingetroffen, so daß ich gleich zu tun bekam. Für mich war der schriftliche Befehl hier, vorläufig auf diesem Platz, der als Proviantlagerplatz und Krankensammelstelle vorgesehen ist, zu bleiben, und weitere […]&quot;},{&quot;name&quot;:&quot;Stamprietfontein / Stampriet&quot;,&quot;date&quot;:&quot;05.–06.01.1905&quot;,&quot;coord&quot;:[18.40464,-24.34494],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Aufklärungspatrouille zur Wasserstelle; Treffen mit Reitern der Abteilung Meister.&quot;,&quot;note&quot;:&quot;Abmarsch am 5., Rückkehr am 6. Januar.&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3352934&quot;,&quot;line&quot;:503,&quot;quote&quot;:&quot;[Kalkfontein, 6. Januar 1905.]\n\n4 Uhr nachmittags von Patrouille zurück; wir fanden im Aluochtal viele gesattelte Pferde und Vieh, der Truppe entlaufen. Nach zweistündigem scharfen Reiten kamen wir auf das Schlachtfeld von Silvesternacht und sahen von der letzten Berghöhe aus zwei Reiter an der Wasserstelle. Wir ritten im Galopp auf diese zu und fanden zwei vorausgeschickte Reiter der Abteilung Meister, einen alten landeskundigen Farmer dabei, die von seiten der Abteilung feststellen sollten, ob Stamprietfontein frei sei. Von ihnen erfuhren wir das erste über das schwere Gefecht bei Großnabas, das 52 Stunden gedauert hatte. Zwei Drittel der ganzen Abteilung ist tot oder verwundet, über die Hälfte der Offiziere tot. Ein Teil der Wagen verloren, Pferde total schlapp, Munition verschossen; aber der Feind hat nicht stand gehalten und ist einem letzten verzweifelten Ansturm weichend, nach Süden geflohen.&quot;},{&quot;name&quot;:&quot;Kalkfontein-Nord&quot;,&quot;date&quot;:&quot;06.01.1905&quot;,&quot;coord&quot;:[18.316667,-24.333333],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Um 16 Uhr von der Patrouille zurück.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:503,&quot;quote&quot;:&quot;[Kalkfontein, 6. Januar 1905.]\n\n4 Uhr nachmittags von Patrouille zurück; wir fanden im Aluochtal viele gesattelte Pferde und Vieh, der Truppe entlaufen. Nach zweistündigem scharfen Reiten kamen wir auf das Schlachtfeld von Silvesternacht und sahen von der letzten Berghöhe aus zwei Reiter an der Wasserstelle. Wir ritten im Galopp auf diese zu und fanden zwei vorausgeschickte Reiter der Abteilung Meister, einen alten landeskundigen Farmer dabei, die von seiten der Abteilung feststellen sollten, ob Stamprietfontein frei sei. Von ihnen erfuhren wir das erste über das schwere Gefecht bei Großnabas, das 52 Stunden gedauert hatte. Zwei Drittel der ganzen Abteilung ist tot oder verwundet, über die Hälfte der Offiziere tot. Ein Teil der Wagen verloren, Pferde total schlapp, Munition verschossen; aber der Feind hat nicht stand gehalten und ist einem letzten verzweifelten Ansturm weichend, nach Süden geflohen.&quot;},{&quot;name&quot;:&quot;Stamprietfontein / Stampriet&quot;,&quot;date&quot;:&quot;07.01.1905&quot;,&quot;coord&quot;:[18.40464,-24.34494],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Besuch der nach schweren Gefechten erschöpften Abteilung.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3352934&quot;,&quot;line&quot;:507,&quot;quote&quot;:&quot;[Kalkfontein, 8. Januar 1905.]\n\nGestern nachmittag bin ich mit meinem Burschen selbst zu der jetzt in Stamprietfontein lagernden Abteilung geritten. Ein trauriges Bild. Überall Zelte mit Verwundeten, die Überlebenden total erschöpft; man war gerade dabei, die Hinterlassenschaft der gefallenen Offiziere an die alles entbehrenden Überlebenden zu verteilen.\n\nNachmittags 5 Uhr: Eben ist Leutnant F. eingetroffen. Er befindet sich als Signaloffizier bei Oberst Deimling und da er keinen heliographischen Anschluß mit uns bekam, hatte er einen kühnen Ritt mitten durch den Feind zu uns unternommen. Oberst D. ist über Gochas siegreich vorgedrungen und hat die Hottentotten in mehreren Gefechten geschlagen. Er hat noch keine Ahnung von dem Geschick der Abteilung Meister und schickt für diesen den Befehl, er solle unbedingt wieder angreifen. F. will in der Nacht noch einmal den kühnen und gefahrvollen Ritt zurückwagen, dem Oberst Nachricht von dem Geschick der Abteilung Meister zu bringen.&quot;},{&quot;name&quot;:&quot;Kalkfontein-Nord&quot;,&quot;date&quot;:&quot;08.01.1905&quot;,&quot;coord&quot;:[18.316667,-24.333333],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Eintrag wieder aus Kalkfontein; Ankunft eines Signaloffiziers.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;&quot;,&quot;line&quot;:507,&quot;quote&quot;:&quot;[Kalkfontein, 8. Januar 1905.]\n\nGestern nachmittag bin ich mit meinem Burschen selbst zu der jetzt in Stamprietfontein lagernden Abteilung geritten. Ein trauriges Bild. Überall Zelte mit Verwundeten, die Überlebenden total erschöpft; man war gerade dabei, die Hinterlassenschaft der gefallenen Offiziere an die alles entbehrenden Überlebenden zu verteilen.\n\nNachmittags 5 Uhr: Eben ist Leutnant F. eingetroffen. Er befindet sich als Signaloffizier bei Oberst Deimling und da er keinen heliographischen Anschluß mit uns bekam, hatte er einen kühnen Ritt mitten durch den Feind zu uns unternommen. Oberst D. ist über Gochas siegreich vorgedrungen und hat die Hottentotten in mehreren Gefechten geschlagen. Er hat noch keine Ahnung von dem Geschick der Abteilung Meister und schickt für diesen den Befehl, er solle unbedingt wieder angreifen. F. will in der Nacht noch einmal den kühnen und gefahrvollen Ritt zurückwagen, dem Oberst Nachricht von dem Geschick der Abteilung Meister zu bringen.&quot;},{&quot;name&quot;:&quot;Stamprietfontein / Stampriet&quot;,&quot;date&quot;:&quot;10.–21.01.1905&quot;,&quot;coord&quot;:[18.40464,-24.34494],&quot;kind&quot;:&quot;Ort&quot;,&quot;summary&quot;:&quot;Dienstübernahme am 10. Januar. Versorgung zahlreicher Verwundeter unter provisorischen Bedingungen.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3352934&quot;,&quot;line&quot;:513,&quot;quote&quot;:&quot;[Stamprietfontein, 11. Januar 1905.]\n\nGestern Dienst bei der Abteilung Meister übernommen. Abends traf zu allgemeiner Überraschung Oberst Deimling mit dem Rest des Regiments und Abteilung Lengerke ein. Es sollen jetzt alle Wassertellen längs der Kalaharigrenze besetzt und so die Wüste, in der sich die Hottentotten befinden, abgesperrt werden. Wir haben hier sehr viel Verwundete. Einige schwere Operationen mußten gleich gemacht werden; so unter anderem eine Schädelhöhleneröffnung bei einem Reiter wegen zunehmender Blutung ins Gehirn infolge Schußverletzung. Narkose unter freiem Himmel. Mitten während der Operation erhebt sich eine Windhose und schleudert Sand und Schmutz auf das freiliegende Gehirn. Doch scheint hier der Erdboden durch die ausdörrende Kraft der Sonne ziemlich keimfrei, denn die Wunde verheilte später ziemlich reaktionslos. Überhaupt spotten die Verhältnisse jeder Beschreibung, unter denen die Verwundeten hier liegen müssen. Mangel an Medikamenten, Verbandsstoffen, Stärkungsmitteln. (Der Sanitätswagen der Abteilung war in die Hände der Hottentotten gefallen und zerstört.) Rücktransport der Verwundeten wegen Mangel an Wagen und Tieren unmöglich. So mußte man sich helfen, wie es ging. Die Verbandsmittel wurden nach jedem Gebrauch neu gewaschen, Schienen aus dem abgedeckten Wellblech des zerstörten Farmdaches vom Fahnenschmied der Batterie verfertigt. So haben wir die Verwundeten drei Wochen hindurch liegen gehabt, kaum daß einige lose im Winde flatternde Zeltbahnen die ärgsten Unbillen der Mittagshitze und Sandstürme abhielten. Wir Überlebenden hatten genug zu […]&quot;},{&quot;name&quot;:&quot;Schürfpenz&quot;,&quot;date&quot;:&quot;bis 30.01.–12.03.1905&quot;,&quot;coord&quot;:[18.29922,-24.26179],&quot;kind&quot;:&quot;Zuordnung&quot;,&quot;summary&quot;:&quot;Versetzung als Absperrungsposten; längerer Aufenthalt mit Ausbau der Unterkünfte.&quot;,&quot;note&quot;:&quot;&quot;,&quot;source&quot;:&quot;https://www.geonames.org/3353219&quot;,&quot;line&quot;:531,&quot;quote&quot;:&quot;[Schürfpenz, 30. Januar 1905.]\n\nWir sind als Absperrungsposten nach Schürfpenz verlegt, einer ehemaligen, jetzt zerstörten Farm und Polizeistation. Auf dem Marsch dahin erwartete uns eine große Freude. Wir begegneten einer Proviantkolonne, die uns unsere Weihnachtspost mitbrachte. Während der Mittagsrast machten wir uns natürlich sofort darüber her, und bald war es unter den alten Anabäumen, wie auf einem gedeckten Weihnachtstisch. Wir schütterten die Herrlichkeiten aus den Paketen alle zusammen auf eine große Zeltbahn, dazu die mitgesandten Tannenzweige mit heimatlichem Weihnachtsgeruch, und dann haben wir so lange Nüsse, Konfekt und Honigkuchen gefuttert, bis die Pferde gesattelt wurden. Wir haben uns hier ganz häuslich eingerichtet. Auf einem über das übrige flache Land emporsteigenden Hügel steht das feste Steingemäuer, in dem wir wohnen; 150 m davon die Wasserstelle, die von dem Geschütz bestrichen werden kann. Wir fühlen uns so sicher hier, daß wir bei einer Belagerung uns länger wie Port Arthur, dessen Fall
